name: Reusable Android workflow

# Builds the Android APK with android/build.sh, as on a developer's machine: the dependencies in a Docker image,
# libopenmw.so in that image, and the APK with Gradle. ui-rework/android.md explains the build.
#
# The dependency image takes over an hour to build, so CI keeps it in the repository's GitHub container registry,
# tagged with a hash of the Dockerfile and its patches. A run that finds no image for its hash builds and pushes one.

on:
  workflow_call:
    inputs:
      label:
        description: The label in the APK file name and the version name, such as the tag. Empty uses the commit.
        default: ""
        type: string
      release:
        description: Build the release APK, signed with the key in the repository's secrets, instead of a debug APK.
        default: false
        type: boolean
    outputs:
      apk:
        description: The APK's file name, which is also the name of its artifact.
        value: ${{ jobs.Android.outputs.apk }}

jobs:
  Android:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      apk: ${{ steps.files.outputs.apk }}

    steps:
    - uses: actions/checkout@v6

    # The dependency image is about 12 GB unpacked, which doesn't fit beside the runner's preinstalled tools.
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost

    - name: Name the dependency image
      id: image
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/modern-morrow-android-deps:${{ hashFiles('android/Dockerfile', 'android/patches/**') }}" >> "$GITHUB_OUTPUT"

    - name: Log in to the container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # Pull requests from forks can't push, so they build the image for that run only.
    - name: Get the dependency image
      env:
        IMAGE: ${{ steps.image.outputs.name }}
      run: |
        if docker pull "$IMAGE"; then
          exit 0
        fi
        android/build.sh deps
        if [ "${{ github.event_name }}" != pull_request ]; then
          docker push "$IMAGE"
        fi

    - name: Keep the compiler cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/android-ccache
        key: android-ccache-${{ github.sha }}
        restore-keys: android-ccache-

    - name: Build libopenmw.so
      env:
        IMAGE: ${{ steps.image.outputs.name }}
        CCACHE_HOST_DIR: ${{ runner.temp }}/android-ccache
        JOBS: 4
        KEEP_SYMBOLS: ${{ inputs.release && '1' || '0' }}
      run: android/build.sh openmw

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@v4

    - name: Name the APK
      id: files
      env:
        LABEL: ${{ inputs.label }}
      run: |
        label="${LABEL:-${GITHUB_SHA::8}}"
        echo "label=$label" >> "$GITHUB_OUTPUT"
        echo "version=${label#v}" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.release }}" = true ]; then
          echo "apk=ModernMorrow-$label-Android-arm64.apk" >> "$GITHUB_OUTPUT"
        else
          echo "apk=ModernMorrow-$label-Android-arm64-debug.apk" >> "$GITHUB_OUTPUT"
        fi

    - name: Write the signing key
      if: ${{ inputs.release }}
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::The ANDROID_KEYSTORE_BASE64 secret isn't set. See ui-rework/releasing.md."
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

    # The run number only grows, so each release installs over the one before it.
    - name: Build the APK
      env:
        MM_VERSION_CODE: ${{ github.run_number }}
        MM_VERSION_NAME: ${{ steps.files.outputs.version }}
        ANDROID_KEYSTORE: ${{ inputs.release && format('{0}/release.keystore', runner.temp) || '' }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        if [ "${{ inputs.release }}" = true ]; then
          android/build.sh release
          mv android/out/modern-morrow-release.apk "android/out/${{ steps.files.outputs.apk }}"
        else
          android/build.sh apk
          mv android/out/modern-morrow-debug.apk "android/out/${{ steps.files.outputs.apk }}"
        fi

    # Not zipped, so the run's page offers the APK itself. The artifact takes the file's name.
    - name: Store the APK
      uses: actions/upload-artifact@v7
      with:
        path: android/out/${{ steps.files.outputs.apk }}
        archive: false

    # Not part of the release. It names the functions in a crash stack from this build.
    - name: Store the debug information
      if: ${{ inputs.release }}
      uses: actions/upload-artifact@v6
      with:
        name: modern-morrow-android-symbols
        path: android/out/symbols/libopenmw.so
