name: Reusable Linux workflow

# Builds the portable Linux package and the AppImage with CI/linux/build_release.sh, on AlmaLinux 9 like OpenMW's
# GitLab pipeline. The same script runs locally in the same container, which the script's comments show how to do.

on:
  workflow_call:
    inputs:
      label:
        description: The label in the package file names, such as the release tag. Empty uses the version.
        default: ""
        type: string
    outputs:
      appimage:
        description: The AppImage's file name, which is also the name of its artifact.
        value: ${{ jobs.Linux.outputs.appimage }}

jobs:
  Linux:
    name: Linux package and AppImage
    runs-on: ubuntu-latest
    container: almalinux:9
    outputs:
      appimage: ${{ steps.files.outputs.appimage }}

    steps:
    # Checking out needs git, and keeping the cache needs tar. The container has neither yet.
    - name: Install git and tar
      run: dnf install -y git tar

    - uses: actions/checkout@v6

    # The compiler cache that build_release.sh keeps in ccache/. A tag's release run can only read caches saved on
    # master or on that same tag.
    - name: Keep the compiler cache
      uses: actions/cache@v4
      with:
        path: ccache
        key: linux-release-ccache-${{ github.sha }}
        restore-keys: linux-release-ccache-

    - name: Build
      run: CI/linux/build_release.sh "${{ inputs.label }}"

    - name: Store the package
      uses: actions/upload-artifact@v6
      with:
        name: modern-morrow-linux-package
        path: build/ModernMorrow*-Linux-x86_64.tar.xz

    # Not part of the release. It names the functions in a crash log from this build, as ui-rework/releasing.md
    # explains.
    - name: Store the debug information
      uses: actions/upload-artifact@v6
      with:
        name: modern-morrow-linux-symbols
        path: build/ModernMorrow*-Linux-x86_64-symbols.tar.xz
        compression-level: 0

    - name: Find the AppImage
      id: files
      run: echo "appimage=$(basename build/ModernMorrow*.AppImage)" >> "$GITHUB_OUTPUT"

    # Not zipped, so the run's page offers the AppImage itself. The artifact takes the file's name.
    - name: Store the AppImage
      uses: actions/upload-artifact@v7
      with:
        path: build/${{ steps.files.outputs.appimage }}
        archive: false
