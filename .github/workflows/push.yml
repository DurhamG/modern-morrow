name: Build and test

# Branch pushes and pull requests build and test on Linux and Windows, and build the Android debug APK. Pushes to
# master also build the Windows and Linux release files. Release tags are built by release.yml instead.
on:
  push:
    branches:
      - '**'
  pull_request:

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  Ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    # Before the build, so a missing localisation key, layer or data file fails in seconds.
    - name: Check the UI data files
      run: python3 CI/check_ui_data.py

    - name: Test the harness client
      run: python3 -m unittest discover -s ui-rework/tools -p 'test_*.py'

    - name: Test the Steam Deck scripts
      run: |
        bash CI/test_auto_update.sh
        bash CI/test_apprun.sh

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ubuntu-${{ env.BUILD_TYPE }}
        max-size: 1000M

    # Modern Morrow doesn't ship OpenMW-CS, the editor, so the build leaves it out.
    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS=OFF
        -D CMAKE_INSTALL_PREFIX=install

    - name: Build
      run: cmake --build . -- -j$(nproc)

    - name: Run components tests
      run: ./components-tests

    # openmw-tests sends real cloud save requests through the system's libcurl, to the Worker from cloudsaves/ run
    # here with a local bucket.
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: cloudsaves/package-lock.json

    - name: Start the cloud saves Worker
      working-directory: cloudsaves
      run: |
        npm ci
        nohup npx wrangler dev --ip 127.0.0.1 --port 8787 --show-interactive-dev-session=false > "$RUNNER_TEMP/wrangler.log" 2>&1 &
        for _ in $(seq 60); do
          if curl -s -o /dev/null http://127.0.0.1:8787/; then exit 0; fi
          sleep 1
        done
        cat "$RUNNER_TEMP/wrangler.log"
        exit 1

    - name: Run OpenMW tests
      env:
        OPENMW_CLOUD_TEST_ADDRESS: http://127.0.0.1:8787
        OPENMW_CLOUD_TEST_SAVE: cloudsaves/test/saves/modern-morrow.omwsave
      run: ./openmw-tests

    # Upstream's Lua tests of the real engine, run against OpenMW's free example-suite game data as upstream's GitLab
    # CI runs them. They only run on Linux. On Windows, the example suite's player model crashes OpenSceneGraph while
    # the game starts, in upstream's build too.
    - name: Install the integration tests' tools
      run: |
        sudo apt-get install -y xvfb git-lfs
        pip3 install --user --break-system-packages numpy matplotlib termtables click

    - name: Run integration tests
      env:
        OPENMW_BINARY: ./openmw
        EXAMPLE_SUITE_REVISION: a1ba6fc9d7315c2158ef4c60349fc4e71b7ca343
      run: CI/run_integration_tests.sh

    - name: Keep the integration tests' output
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: integration-tests-output
        path: integration_tests_output/

    # - name: Install
    #   shell: bash
    #   run: cmake --install .

    # - name: Create Artifact
    #   shell: bash
    #   working-directory: install
    #   run: |
    #     ls -laR
    #     7z a ../build_artifact.7z .

    # - name: Upload Artifact
    #   uses: actions/upload-artifact@v1
    #   with:
    #     path: ./build_artifact.7z
    #     name: build_artifact.7z

  # Checks that need no build. actionlint finds mistakes in the workflows, such as a misspelled input or an output
  # that doesn't exist, which otherwise only show when a tag is pushed. Its shellcheck and pyflakes passes are off,
  # because they report style in the workflows' scripts rather than mistakes.
  Lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Check file names
      run: bash CI/check_file_names.sh

    - name: Check the workflows
      run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck= -pyflakes=

  Cloud-saves:
    name: Cloud saves Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudsaves

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: cloudsaves/package-lock.json

    - name: Install the Worker's tools
      run: npm ci

    - name: Type-check the Worker
      run: npm run check

    - name: Test the Worker
      run: npm test

  Windows:
    strategy:
      fail-fast: true
      matrix:
        image:
        - "2022"

    uses: ./.github/workflows/windows.yml
    with:
      image: ${{ matrix.image }}

  # Pushes to master also build the release files, as release.yml does, without making a release. The release builds
  # keep compiler caches, and a tag's release run can only read caches saved on master, so these runs keep the release
  # builds fast. Testers can also take the files from the run's page, under Artifacts.
  Windows-Release-Files:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true

  Linux-Release-Files:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/linux.yml

  # Packages: write lets it keep the Android dependency image in the container registry.
  Android:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/android.yml
    # The signing key, which android.yml only uses for pushes to master.
    secrets: inherit
