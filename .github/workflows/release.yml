name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer, the Windows zip, the Linux AppImage and the Android APK,
# and puts them in a draft release for the tag, to check and publish by hand. Starting the workflow by hand from the
# Actions tab builds the same files without making a release, and leaves them on the run's page.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Windows:
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true
      label: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit

  Linux:
    uses: ./.github/workflows/linux.yml
    with:
      label: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  # Packages: write lets it keep the Android dependency image in the container registry. The signing key comes from
  # the repository's secrets.
  Android:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/android.yml
    with:
      label: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      release: true
    secrets: inherit

  # One job makes the release, so the builds, which run side by side, don't each make a draft of their own.
  Publish:
    if: ${{ github.ref_type == 'tag' }}
    needs: [Windows, Linux, Android]
    runs-on: ubuntu-latest

    steps:
    - name: Fetch the Windows files
      uses: actions/download-artifact@v5
      with:
        name: openmw-windows-2022-package-${{ github.sha }}
        path: windows

    - name: Fetch the AppImage
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.Linux.outputs.appimage }}
        path: linux

    - name: Fetch the APK
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.Android.outputs.apk }}
        path: android

    # The update script from CI/linux/appimage is a file of the release too.
    - uses: actions/checkout@v6
      with:
        path: source
        sparse-checkout: CI/linux/appimage

    # A moved tag runs this workflow again for a release that may already be published. GitHub only finds published
    # releases by their tag, so a release that is still a draft isn't found, and the run makes a second draft. Any
    # answer other than "not found" stops the run, so a published release never goes through the step that makes one.
    - name: Look for a published release for the tag
      id: existing
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --silent 2> lookup-error.txt; then
          echo "published=true" >> "$GITHUB_OUTPUT"
        elif grep -q "HTTP 404" lookup-error.txt; then
          echo "published=false" >> "$GITHUB_OUTPUT"
        else
          cat lookup-error.txt
          exit 1
        fi

    # The first run for a tag makes a draft pre-release. The update script follows the release marked as the latest,
    # and a pre-release can't be marked as the latest, so publishing it doesn't reach the script's users.
    - name: Make the release
      if: ${{ steps.existing.outputs.published != 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        prerelease: true
        files: |
          windows/*.exe
          windows/*.zip
          linux/*.AppImage
          android/*.apk
          source/CI/linux/appimage/ModernMorrow-AutoUpdate.sh

    # A run for a tag whose release is published, such as after the tag is moved, only replaces the files. This step
    # leaves out the prerelease input, because the action sets an existing release's pre-release flag to that input
    # when it is given, and that would take a release that was marked as the latest off the update script. The draft
    # input doesn't change a published release. It only stops the action from publishing one at the end.
    - name: Update the release's files
      if: ${{ steps.existing.outputs.published == 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        files: |
          windows/*.exe
          windows/*.zip
          linux/*.AppImage
          source/CI/linux/appimage/ModernMorrow-AutoUpdate.sh
