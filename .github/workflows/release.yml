name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer, the Windows zip and the Linux AppImage, and puts them in
# a draft release for the tag, to check and publish by hand. Starting the workflow by hand from the Actions tab builds
# the same files without making a release, and leaves them on the run's page.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Windows:
    uses: ./.github/workflows/windows.yml
    with:
      image: "2022"
      build-type: Release
      package: true
      label: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit

  Linux:
    uses: ./.github/workflows/linux.yml
    with:
      label: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  # One job makes the release, so the builds, which run side by side, don't each make a draft of their own.
  Publish:
    if: ${{ github.ref_type == 'tag' }}
    needs: [Windows, Linux]
    runs-on: ubuntu-latest

    steps:
    - name: Fetch the Windows files
      uses: actions/download-artifact@v5
      with:
        name: openmw-windows-2022-${{ github.sha }}
        path: windows

    - name: Fetch the AppImage
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.Linux.outputs.appimage }}
        path: linux

    # The update script from CI/linux/appimage is a file of the release too.
    - uses: actions/checkout@v6
      with:
        path: source
        sparse-checkout: CI/linux/appimage

    # The first run for a tag makes a draft. Once the release is published, a run for the same tag, such as after the
    # tag is moved, replaces its files and keeps it published.
    - name: Make or update the release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        prerelease: true
        files: |
          windows/*.exe
          windows/*.zip
          linux/*.AppImage
          source/CI/linux/appimage/ModernMorrow-AutoUpdate.sh
