# The Morrowind.ini settings that OpenMW's ini importer (apps/mwiniimporter) copies on the desktop, which the global
# openmw.cfg in files/ doesn't have, chiefly the Ashstorm and Blight weathers. Without them the built-in weather script
# stops when a game loads. The Android app can't import Morrowind.ini, since players only copy Data Files, so these
# are added to its global openmw.cfg. The values come from the Steam release's Morrowind.ini.
