LockoutKillThievesBosses: "This order is to kill the Thieves Guild's bosses in Balmora, Ald'ruhn and Sadrith Mora. Doing it ends most of the Thieves Guild's quests."
LockoutMajorChoice: "This is a major choice. Going ahead closes off other paths in the game."
