GameOptionsBegin: "Begin"
GameOptionsExclusiveChoicesText: "In Morrowind, some choices quietly close off other paths through the game, and you only find out later. With this on, the game warns you before one of these choices and asks whether to go ahead. The warning doesn't say what you'd miss unless you ask it to explain, so it spoils nothing."
GameOptionsGlancingBlowsText: "In Morrowind, an attack that reaches its target can still miss, and a new character misses often. With this on, your attacks that would miss land as glancing blows, which do a tenth of the damage. Other characters' attacks still miss."
GameOptionsIntro: "These options fix some common complaints with Morrowind gameplay. They each default to off. You can change them at any time from Options, on the Prefs tab."
GameOptionsKeepLevelUpProgressText: "In Morrowind, a level up forgets every skill increase it doesn't use, so raising three attributes by 5 at each level takes careful planning. With this on, the skill increases a level up doesn't need count toward the next one."
GameOptionsMinimumRunSpeedText: "In Morrowind, a new character with low Speed and Athletics runs slowly, and more slowly still when carrying loot. With this on, the minimum run speed is increased so you're never painfully slow."
GameOptionsQuestCompassText: "In Morrowind, the journal often gives directions, such as north of a town, but nothing on screen shows which way you're facing. With this on, a compass along the top of the screen shows which way you're facing. With Quest Markers on too, it also shows where the quests you track go next."
GameOptionsQuestMarkersText: "In Morrowind, the journal is the only guide to where a quest goes next. With this on, the quests you track are marked on the maps. A quest is tracked when it starts or moves on, and you can choose which to track from the journal. This option is experimental. The markers were checked quest by quest, but about 1 in 20 quest steps may still mark the wrong place, or nothing at all."
GameOptionsRetroactiveHealthText: "In Morrowind, raising your Endurance only raises your health for future level ups, not past ones. This means every level up without raising Endurance is a wasted opportunity. With this on, raising Endurance retroactively increases your health for earlier level ups as well."
GameOptionsRunFatigueText: "In Morrowind, running wears down your fatigue, and low fatigue makes you worse at nearly everything. This sets how much fatigue running takes, from Morrowind's full amount at 100% to none at all at 0%."
