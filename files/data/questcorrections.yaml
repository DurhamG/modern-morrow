        - { task: visit, cell: "Caldera Mine", after: { quest: IC13_rumor, started: true }, done: { quest: IC13_slave, started: true } }
    # Journals 40 and 42 say Cunius gave three pieces of raw ebony to sell for the 500 gold. His line that needs this
    # quest at 40 or more comes first in "donate 500 drakes" and only says their business is done, so his ways to
    # 42 can't come up. The fetch of the ledger in that way would also mark its chest. Iulus waits for the gold.
    - stages: 40-42
      hide: [42, 50]
      targets:
        - { task: talk, object: iulus truptor, after: { carried: gold_001, atLeast: 500 }, done: { quest: IC13_rich, atLeast: 50 } }

  IC14_Ponius:
    # Journal 1 sends the player to Canctunian Ponius in the East Empire Company Hall for his pledge. Iulus Truptor's
    # choice in "Greeting 5" that leads to 50 is only offered when the player carries 1000 gold, which the analysis
    # doesn't see, so the default rule marks him from the start. Ponius's answers in "generous pledge" lead to 10 and
    # 15, and his answers in "embezzled funds" and "Mossanon" lead to 18 and 20. So he stays the one to talk to while
    # the player learns about the missing clerk.
    - stages: 1-18
      hide: 50
    # At 20 Ponius has said Mossanon was often away, and his answer in "Mossanon" suggests asking the other employees.
    # His answers that lead to 25 to 40 report failure or hand over gold, and the ones that hand over gold need it
    # carried, which the analysis doesn't see. So he would stay marked while the player should be out looking. Okan-Shei
    # and Shazgob gra-Luzgan, placed in the same hall, start IC14_Okan and IC14_Shazgob in "Mossanon". Journal 1 of
    # IC14_Shazgob points to the guild guide at the Mages Guild in Vivec, Flacassia Fauseius, who starts
    # IC14_Flacassia. Journal 1 of IC14_Flacassia names Sadrith Mora, where Sinyaramen in the Gateway Inn starts
    # IC14_Sinyaramen. His journal says to ask the women of the town, whose answers name Volmyni Dral but set no
    # journal entry. Mossanon is placed in her house in Sadrith Mora, so he is marked from IC14_Sinyaramen on, and also
    # once the player has put him off, which starts IC14_Delay. His answers in "embezzled funds" that hand over the
    # 2500 gold set IC14_Demand or IC14_Promise to 5, and his refusals set them to 1, so those two quests are followed
    # to mark him after a refusal. Ponius is marked again once Mossanon has paid or is dead, since he carries the gold.
    # A done condition holds only one condition, so the Mossanon targets stay until Ponius has the gold.
    - stages: 20
      hide: [25-40, 50]
      targets:
        - { task: talk, object: okan_shei, done: { quest: IC14_Okan, started: true } }
        - { task: talk, object: shazgob gra-luzgan, done: { quest: IC14_Shazgob, started: true } }
        - { task: talk, object: flacassia fauseius, after: { quest: IC14_Shazgob, started: true },
            done: { quest: IC14_Flacassia, started: true } }
        - { task: visit, cell: "Sadrith Mora", after: { quest: IC14_Flacassia, started: true },
            done: { quest: IC14_Sinyaramen, started: true } }
        - { task: talk, object: mossanon, after: { quest: IC14_Sinyaramen, started: true } }
        - { task: talk, object: mossanon, after: { quest: IC14_Delay, started: true } }
        - { task: talk, object: canctunian ponius, after: { quest: IC14_Demand, atLeast: 5 } }
        - { task: talk, object: canctunian ponius, after: { quest: IC14_Promise, atLeast: 5 } }
        - { task: talk, object: canctunian ponius, after: { dead: mossanon } }
      follow: [IC14_Demand, IC14_Promise]
    # Journal 25 records that the player told Ponius the search had failed, and that he won't pay. What is left is to
    # tell Iulus Truptor. Ponius's answers that lead to 30 to 40 need gold the player hasn't brought.
    - stages: 25
      hide: 30-40
    # Journals 30, 35 and 40 say Ponius took the recovered gold and can now pay. His answers in "generous pledge" and
    # "1000-drake pledge" lead to 45 and hand over the 1000 gold. Iulus is marked once the player has it, at 45.
    - stages: 30-40
      hide: 50

  IC15_Missing_Limeware:
    # Journal 1 says to find Caryarel by asking other High Elves where he lives. The High Elves' answers in "Caryarel"
    # lead to 10, or to 15 in Ebonheart, which the analysis marks as the town. Those answers are the step, but any High
    # Elf can give one, so Ebonheart is optional. Caryarel in Gnaar Mok isn't named yet. The way to 50 fetches the
    # bowl misc_lw_bowl_chapel, whose only placed copy is in "Mournhold, Llethan Manor", far from Caryarel.
    - stages: 1
      optional: 15
      hide: [25, 50]
    # No line sets 5, and its journal says the player gave up the search, so nothing is marked.
    - stages: 5
      hide: [15, 25, 50]
    # Journals 10, 15 and 20 name Gnaar Mok, where Caryarel is placed outdoors. His greeting leads to 25. The answers
    # in Ebonheart that lead to 15 only add sailing directions, so they are optional. No line sets 20. The fetch still
    # points to Mournhold, so Kaye is marked once the player carries the bowl.
    - stages: 10-20
      optional: 15
      hide: 50
      targets:
        - { task: talk, object: kaye, after: { carried: misc_lw_bowl_chapel } }
    # Journal 25 says Caryarel denied knowing about the bowl. The bowl lies in the barrel caryarel_barrel in
    # "Gnaar Mok, Caryarel's Shack", his home, but the fetch would mark the copy in Mournhold. So the shack is marked
    # until the player carries the bowl, and Kaye from then on.
    - stages: 25
      hide: 50
      targets:
        - { task: visit, cell: "Gnaar Mok, Caryarel's Shack", done: { carried: misc_lw_bowl_chapel } }
        - { task: talk, object: kaye, after: { carried: misc_lw_bowl_chapel } }

  IC16_Haunting:
    # Journals 1 and 10 send the player to Nedhelas in Caldera, whose greeting leads to 12. Journal 12 points to the
