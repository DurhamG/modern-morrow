    - stages: [55, 60]
      next: 110

  FG_SilenceTaxgirl:
    # Journal 10 gives a bounty on Adraria Vandacia, placed in the Census and Excise Warehouse in Seyda Neen.
    # Persius Mercius's answer in "Adraria Vandacia" leads to 50, but the journal doesn't mention him, and the
    # default rule marks him solid as the lowest way.
    - stages: 10
      hide: 50

  FG_SuranBandits:
    # Journal 10 sends the player to Avon Oran in Suran. His answer in "bandits in Suran" leads to 30 and needs
    # FG_BeneranBounty at 100, which held when this quest started. The default rule also marks the kill of Daldur
    # Sarys, whom journal 30 names first.
    - stages: 10
      next: 30

  FG_Telasero:
    # At 50 Sondaale of Shimmerene follows the player, and the script sondaaleFollow sets 70 once the player has
    # left both "Telasero, Lower Level" and "Telasero, Upper Level" with her. So the goal is the way out. The
    # exterior cell outside the dungeon is named "Telasero", so a visit to it marks the first door on the way out.
