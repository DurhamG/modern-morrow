    # Journal 10 is the same dead end, for a murder.
    - stages: 10
      hide: [20, 50, 60]
    # At 20 Morvayn will share her concerns with the other councilors. Her line leading to 50 needs B5_SarethiHort at
    # 50. The choices leading to 60 need House Redoran membership or HR_MorvaynManor done, which the journal never
    # suggests. At 50 she has already confirmed the player.
    - stages: [20, 50]
      hide: 60

  B5_RamoranHort:
    # Journal 5 says Hlaren Ramoran refuses after a councilor was killed. His lines for RedoranMurdered come first in
