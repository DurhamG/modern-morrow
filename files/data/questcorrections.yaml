  TT_SevenGraces:
    # Journal 10 asks the player to make the seven pilgrimages in "The Pilgrim's Path". Each pilgrimage is its own
    # quest, which a shrine's script sets to 100: TT_FieldsKummu, TT_Ghostgate, TT_MaskVivec, TT_PalaceVivec,
    # TT_PuzzleCanal, TT_RuddyMan and TT_StopMoon. The script templeStewards on the Temple's quest givers checks all
    # seven, and only then does the report in "Seven Graces" work. No line or script of this quest names the shrines,
    # so each is a target until its quest reaches 100. The palace shrine ac_shrine_palace is placed twice in the
    # Vivec Temple canton. At the Puzzle Canal the Dremora Krazzt, dremora_ttpc, takes a silver longsword first and
    # starts TT_PuzzleCanal at 50, whose own marker then leads to the shrine.
    # The report in "Seven Graces" can be made to any Temple member of rank 8 or more, so the way to 100 has no single
    # speaker, and the analysis can't test the local completedGraces. It would mark the nearest Temple member from
    # the start, who might not run templeStewards. That way is hidden. The six quest givers that run templeStewards are
    # Tholer Saryoni and Endryn Llethan in "Vivec, High Fane", Tuls Valen in "Ald-ruhn, Temple", Uvoo Llaren in
    # "Ghostgate, Temple", Tharer Rotheloth in "Molag Mar, Temple" and Feldrelo Sadri in "Balmora, Temple". Any of them
    # takes the report, so each is marked once all seven pilgrimages are done.
    - stages: 10
      hide: 100
      targets:
        - { task: visit, object: furn_shrine_vivec_cure_02, done: { quest: TT_FieldsKummu, atLeast: 100 } }
        - { task: visit, object: furn_shrine_vivec_cure_03, done: { quest: TT_Ghostgate, atLeast: 100 } }
        - { task: visit, object: ac_shrine_gnisis, done: { quest: TT_MaskVivec, atLeast: 100 } }
        - { task: visit, object: ac_shrine_palace, done: { quest: TT_PalaceVivec, atLeast: 100 } }
        - { task: talk, object: dremora_ttpc, done: { quest: TT_PuzzleCanal, started: true } }
        - { task: visit, object: ac_shrine_koalcave, done: { quest: TT_RuddyMan, atLeast: 100 } }
        - { task: visit, object: ac_shrine_stopmoon, done: { quest: TT_StopMoon, atLeast: 100 } }
        - { task: talk, object: tholer saryoni, done: { quest: TT_SevenGraces, atLeast: 100 },
            after: [{ quest: TT_FieldsKummu, atLeast: 100 }, { quest: TT_Ghostgate, atLeast: 100 },
                    { quest: TT_MaskVivec, atLeast: 100 }, { quest: TT_PalaceVivec, atLeast: 100 },
                    { quest: TT_PuzzleCanal, atLeast: 100 }, { quest: TT_RuddyMan, atLeast: 100 },
                    { quest: TT_StopMoon, atLeast: 100 }] }
        - { task: talk, object: endryn llethan, done: { quest: TT_SevenGraces, atLeast: 100 },
            after: [{ quest: TT_FieldsKummu, atLeast: 100 }, { quest: TT_Ghostgate, atLeast: 100 },
                    { quest: TT_MaskVivec, atLeast: 100 }, { quest: TT_PalaceVivec, atLeast: 100 },
                    { quest: TT_PuzzleCanal, atLeast: 100 }, { quest: TT_RuddyMan, atLeast: 100 },
                    { quest: TT_StopMoon, atLeast: 100 }] }
        - { task: talk, object: tuls valen, done: { quest: TT_SevenGraces, atLeast: 100 },
            after: [{ quest: TT_FieldsKummu, atLeast: 100 }, { quest: TT_Ghostgate, atLeast: 100 },
                    { quest: TT_MaskVivec, atLeast: 100 }, { quest: TT_PalaceVivec, atLeast: 100 },
                    { quest: TT_PuzzleCanal, atLeast: 100 }, { quest: TT_RuddyMan, atLeast: 100 },
                    { quest: TT_StopMoon, atLeast: 100 }] }
        - { task: talk, object: uvoo llaren, done: { quest: TT_SevenGraces, atLeast: 100 },
            after: [{ quest: TT_FieldsKummu, atLeast: 100 }, { quest: TT_Ghostgate, atLeast: 100 },
                    { quest: TT_MaskVivec, atLeast: 100 }, { quest: TT_PalaceVivec, atLeast: 100 },
                    { quest: TT_PuzzleCanal, atLeast: 100 }, { quest: TT_RuddyMan, atLeast: 100 },
                    { quest: TT_StopMoon, atLeast: 100 }] }
        - { task: talk, object: tharer rotheloth, done: { quest: TT_SevenGraces, atLeast: 100 },
            after: [{ quest: TT_FieldsKummu, atLeast: 100 }, { quest: TT_Ghostgate, atLeast: 100 },
                    { quest: TT_MaskVivec, atLeast: 100 }, { quest: TT_PalaceVivec, atLeast: 100 },
                    { quest: TT_PuzzleCanal, atLeast: 100 }, { quest: TT_RuddyMan, atLeast: 100 },
                    { quest: TT_StopMoon, atLeast: 100 }] }
        - { task: talk, object: feldrelo sadri, done: { quest: TT_SevenGraces, atLeast: 100 },
            after: [{ quest: TT_FieldsKummu, atLeast: 100 }, { quest: TT_Ghostgate, atLeast: 100 },
                    { quest: TT_MaskVivec, atLeast: 100 }, { quest: TT_PalaceVivec, atLeast: 100 },
                    { quest: TT_PuzzleCanal, atLeast: 100 }, { quest: TT_RuddyMan, atLeast: 100 },
                    { quest: TT_StopMoon, atLeast: 100 }] }
      follow: [TT_PuzzleCanal]

  TT_PilgrimsPath:
    # Reading "The Pilgrim's Path" sets 100, which doesn't finish the quest, and journal 100 says the shrines are now
    # on the map. No line or script moves the quest on. The shrines and their quests are the same as in
    # TT_SevenGraces above, so each shrine is a target until its pilgrimage is done.
    - stages: 100
