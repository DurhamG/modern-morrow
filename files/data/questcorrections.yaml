      next: 110

  HH_EggMine:
    # Journal 10 asks the player to kill the kwama queen in the Inanius Egg Mine and report to Nileno Dorvayn.
    # Avon Oran's answer that leads to 200 is a bribe from the mine's owner, whom no journal entry has named.
    - stages: 10
      next: 100
    # Journal 200 says to tell Nileno Dorvayn about the bribe. Her line at 200 doesn't move the quest on. The only
    # way forward is killing the queen anyway, which leads to 210 and breaks the player's word to Avon Oran. The
    # journal doesn't suggest that, so it is hidden.
    - stages: 200
      hide: 210

  HH_IndEsp1:
    # Journal 10 asks the player to steal Aurane Frernis's formulas. Nileno Dorvayn's line that leads to 200 needs
    # Aurane dead, and Nileno scolds the player for it. Aurane speaks no line of this quest, so the default rule
    # marks her as a kill. The three formulas, one of them carried by Aurane, stay marked.
    - stages: 10
      hide: 200

  HH_IndEsp4:
    # Journal 10 offers a choice: persuade Canctunian Ponius in Ebonheart, which leads to 50, or shut down Sudanit
    # Mine by killing Darns Tedalen, which leads to 110. The default rule marks only the way to 110 and Nileno
    # Dorvayn's directions in "Sudanit mine", which lead to 20. The directions are a side step.
    - stages: 10
      next: [50, 110]
      optional: 20
    # At 50 Ponius has agreed, and Nileno Dorvayn's line leads to 100. Her line that started the quest promised a
    # bonus for doing both, so killing Darns Tedalen, which leads to 110, is optional.
    - stages: 50
      next: 100
      optional: 110

  HH_Odirniran:
    # Journal 10 says to go to Odirniran and speak with any survivors. Remasa Othril's line in "Odirniran" leads to
    # 30. The default rule also marks the necromancer Milyn Faram to be killed, before anyone has named him.
    - stages: 10
      next: 30
    # At 80 Milyn Faram is dead, because the line that leads to 80 needs his death. Remasa Othril's line that
    # leads to 90 thanks the player for a rescue that didn't happen. Edryno Arethi's line leads to 100.
    - stages: 80
      next: 100

  HH_RentCollector:
    # Journal 10 names the two farmers, Manat Varnan-Adda and Llovyn Andus. Their lines in "rent and taxes" lead to
