    # the way that fetches "Antecedents of Dwemer Law" and Ethes Evos's sale of a copy (50). That book is placed 37
    # times, so its fetch marks whoever holds one, which is only a crate in the test cell "ToddTest". The other two
    # books move HT_FireAndFaith and HT_ChroniclesNchuleft, so nothing marks them here. The ways to 100 and 130 are
    # hidden. Baladas is marked when the player carries a book he still wants. Ethes Evos in Arobar Manor sells a
    # copy of "Antecedents", so his way is optional. Baladas's answer about "Chronicles of Nchuleft" names the ruin
    # of Nchuleft and booksellers. A copy is placed in the cell "Nchuleft", Jobasha carries one, and Dorisa Darvel
    # sells them. These three are optional until the player carries the book. Baladas's answer about "Fire and
    # Faith" names rare booksellers, and a copy of that book is placed in Dorisa's shop in Balmora. So she is also
    # optional until the player carries "Fire and Faith". HT_FireAndFaith marks its own book once a rumour starts it.
    - stages: 5-32
      hide: [100, 130]
      optional: 50
      targets:
        - { task: talk, object: baladas demnevanni, after: { carried: bk_antecedantsdwemerlaw }, done: { quest: HT_DwemerLaw, atLeast: 100 } }
        - { task: talk, object: baladas demnevanni, after: { carried: bk_nchunaksfireandfaith }, done: { quest: HT_FireAndFaith, atLeast: 100 } }
        - { task: talk, object: baladas demnevanni, after: { carried: bk_chroniclesnchuleft }, done: { quest: HT_ChroniclesNchuleft, atLeast: 100 } }
        - { task: visit, cell: "Nchuleft", optional: true, done: { carried: bk_chroniclesnchuleft } }
        - { task: talk, object: jobasha, optional: true, done: { carried: bk_chroniclesnchuleft } }
        - { task: talk, object: dorisa darvel, optional: true, done: { carried: bk_chroniclesnchuleft } }
        - { task: talk, object: dorisa darvel, optional: true, done: { carried: bk_nchunaksfireandfaith } }
      follow: [HT_FireAndFaith]
    # At 100 "Antecedents" has been delivered. The ways to 110 and 120 are the last-book answers for the other two
    # books, and need the other book's quest at 100. So with two books left nothing is marked. With one left, the
    # fetch of "Fire and Faith" marks all eight placed copies, from Mababi and Shishara to Mournhold. The way to 130
    # can't happen any more, because Baladas's answer for a book already brought comes first. All three are hidden,
    # and the targets above are kept for the two other books, with Dorisa Darvel as a hint for both.
    - stages: 100
      hide: [110, 120, 130]
      targets:
        - { task: talk, object: baladas demnevanni, after: { carried: bk_nchunaksfireandfaith }, done: { quest: HT_FireAndFaith, atLeast: 100 } }
        - { task: talk, object: baladas demnevanni, after: { carried: bk_chroniclesnchuleft }, done: { quest: HT_ChroniclesNchuleft, atLeast: 100 } }
        - { task: visit, cell: "Nchuleft", optional: true, done: { carried: bk_chroniclesnchuleft } }
        - { task: talk, object: jobasha, optional: true, done: { carried: bk_chroniclesnchuleft } }
        - { task: talk, object: dorisa darvel, optional: true, done: { carried: bk_chroniclesnchuleft } }
        - { task: talk, object: dorisa darvel, optional: true, done: { carried: bk_nchunaksfireandfaith } }
      follow: [HT_FireAndFaith]

  HT_EddieAmulet:
    # Journal 10 asks for five potions of Invisibility for Fast Eddie. His line that offers the hand-over needs five
    # carried. The way to 50 fetches the potion, which is placed only four times: in Jolda's shop in Tel Mora, twice
    # in Tel Fyr, and in Gandrung Caverns on Solstheim. Those are not enough and the journal names none of them. The
    # way is hidden, and Eddie is marked once the player carries five.
    - stages: 10
      hide: 50
      targets:
        - { task: talk, object: edd theman, after: { carried: p_invisibility_s, atLeast: 5 }, done: { quest: HT_EddieAmulet, atLeast: 50 } }

  HT_FireAndFaith:
    # Journal 30 comes from a Temple member in Vivec, who says the Hall of Wisdom holds a copy of "Nchunak's Fire and
    # Faith". The book is placed eight times, so the way to 100 marks every copy, from Mababi and Shishara to
    # Mournhold. No copy is placed in the Hall of Wisdom or its Library of Vivec. The nearest copy is in the cell
    # "Vivec, Hall of Justice Secret Library", whose doors are in the Justice Offices and the Office of the Watch.
    # Baladas Demnevanni says the temple's copy in Vivec sits in a well guarded library. So that secret library is
    # marked until the player has the book, and Baladas after that.
    - stages: 30
      hide: 100
      targets:
        - { task: visit, cell: "Vivec, Hall of Justice Secret Library", done: { carried: bk_nchunaksfireandfaith } }
        - { task: talk, object: baladas demnevanni, after: { carried: bk_nchunaksfireandfaith }, done: { quest: HT_FireAndFaith, atLeast: 100 } }
    # Journal 31 comes from a bookseller, who points to Dorisa Darvel's shop in Balmora, where one copy is placed.
    - stages: 31
      hide: 100
      targets:
        - { task: visit, cell: "Balmora, Dorisa Darvel: Bookseller", done: { carried: bk_nchunaksfireandfaith } }
        - { task: talk, object: baladas demnevanni, after: { carried: bk_nchunaksfireandfaith }, done: { quest: HT_FireAndFaith, atLeast: 100 } }

  HT_MineCure:
    # Journal 10 asks the player to cure the Kwama queen in the Mudan-Mul Egg Mine. Aryon's answer that leads to 20
    # teaches a cure spell, which the player can take or leave, so it is optional. The queen's script sets 70 once
    # she is cured.
    - stages: 10
      optional: 20

  HT_Monopoly:
    # Journal 10 asks for three Redoran councilors to agree. Aryon suggests Athyn Sarethi first. Sarethi's vote in
    # "Mages Guild monopoly" only sets a local variable, and nothing sets journal 30, so no way marks him. Miner
    # Arobar, Garisa Llethri, Hlaren Ramoran and Brara Morvayn agree in "appeal to fairness", which leads to 32, 33,
    # 34 and 31. The default rule marks only the lowest and highest of these. Aryon's answers that lead to 100 and
    # 200 need the global MonopolyVotes, which the script CountMonopolyVotes sets from his greeting. All four
    # councilors are real choices, so all are marked, with Sarethi as an optional target.
    - stages: [10, 30]
      next: [31-34, 100, 200]
      targets:
        - { task: talk, object: athyn sarethi, optional: true }
    # The journal index only goes up, so at 31 Morvayn has agreed and the other three have not.
    - stages: 31
      next: [32-34, 100, 200]
      targets:
        - { task: talk, object: athyn sarethi, optional: true }
    # At 32 Arobar has agreed, Llethri and Ramoran have not, and Morvayn may or may not have. Three votes are
    # possible from here, so Aryon is optional too, since his greeting counts the votes.
    - stages: 32
      next: [33, 34, 100, 200]
      targets:
        - { task: talk, object: athyn sarethi, optional: true }
        - { task: talk, object: brara morvayn, optional: true }
        - { task: talk, object: aryon, optional: true }
    # At 33 Llethri has agreed and Ramoran has not. Morvayn and Arobar may or may not have.
    - stages: 33
      targets:
        - { task: talk, object: athyn sarethi, optional: true }
        - { task: talk, object: brara morvayn, optional: true }
        - { task: talk, object: miner arobar, optional: true }
        - { task: talk, object: aryon, optional: true }
    # At 34 Ramoran has agreed. No way is left to the other councilors, but any of them may still be needed.
    - stages: 34
      targets:
        - { task: talk, object: athyn sarethi, optional: true }
        - { task: talk, object: brara morvayn, optional: true }
        - { task: talk, object: miner arobar, optional: true }
        - { task: talk, object: garisa llethri, optional: true }
        - { task: talk, object: aryon, optional: true }

  HT_Muck:
    # Journal 10 asks for five portions of muck for Raven Omayn, who says alchemists sell it. Her line that leads
    # to 100 needs five carried. Muck is placed 31 times, so the way marks whoever holds some, such as a chest in
    # Ashmelech and a crate in the test cell "ToddTest". The way is hidden. Raven is marked once the player carries
    # five. Anis Seloth, an alchemist in Sadrith Mora, sells muck, so she is an optional hint.
    - stages: 10
      hide: 100
      targets:
        - { task: talk, object: anis seloth, optional: true, done: { carried: ingred_muck_01, atLeast: 5 } }
        - { task: talk, object: raven omayn, after: { carried: ingred_muck_01, atLeast: 5 }, done: { quest: HT_Muck, atLeast: 100 } }

  HT_NchuleftKey:
    # Journal 10 asks for Dwemer schematics from the ruins of Nchuleft. The schematics misc_dwrv_artifact40 are
    # placed three times, so the way to 100 marks all three. The other two copies are in Sorkvild's Tower in Dagon
    # Fel and in the Central Tower of Tel Vos, which the journal doesn't mention. The way is hidden. The cell
    # "Nchuleft" is marked until the player has the schematics, and Mallam Ryon after that.
    - stages: 10
      hide: 100
      targets:
        - { task: visit, cell: "Nchuleft", done: { carried: misc_dwrv_artifact40 } }
        - { task: talk, object: mallam ryon, after: { carried: misc_dwrv_artifact40 }, done: { quest: HT_NchuleftKey, atLeast: 100 } }

  HT_Odirniran:
    # Journal 10 says to find Milyn Faram first. His line in "Odirniran" that leads to 30 has no checks. The way to
    # 100 kills Remasa Othril and reports to Aryon, which the journal doesn't ask for yet.
    - stages: 10
      next: 30
    # Journal 30 says Milyn asked for Remasa Othril dead. His line that leads to 50 needs her dead, so she is marked
    # to kill and then he is. Reporting straight to Aryon (100) skips Milyn, which the journal doesn't suggest.
    - stages: 30
      next: 50
    # At 50 the task is done and Aryon is the one to report to. Milyn's research talk that leads to 60 is a side
    # step the player can skip.
    - stages: 50
      optional: 60

  HT_RecruitEddie:
    # Journal 10 says to find a Mouth, without naming anyone. Enar Releth's and Raven Omayn's answers in "Mouth" lead
    # to 30 and name Fast Eddie. The way to 50 is Eddie himself, whom the journal hasn't named yet.
    - stages: 10
      next: 30
    # Journal 30 sends the player to Fast Eddie in Balmora. His answer that leads to 50 comes after a line that needs
    # a Silver Staff of Peace, and he asks for it himself. The way fetches the staff first, and the staff is carried
    # by six unrelated people across the island. The player usually has one from HT_BaladasAlly. So the way is
    # hidden, and Eddie is marked until he agrees.
    - stages: 30
      hide: 50
      targets:
        - { task: talk, object: edd theman, done: { quest: HT_RecruitEddie, atLeast: 50 } }

  HT_Shishi:
    # Journal 10 sends the player to help Faves Andas against the Redorans attacking Shishi. Faves's line in "Shishi"
    # that leads to 50 needs their leader, Brerama Selas, dead. Kills are marked before the talk they lead to, so
    # Faves would only be marked once she is dead. Faves is marked from the start. The way to 100 reports to Aryon,
    # and journal 10 doesn't ask for that yet.
    - stages: 10
      hide: 100
      targets:
        - { task: talk, object: faves andas, done: { quest: HT_Shishi, atLeast: 50 } }

  HT_SlaveRebellion:
    # Journal 10 asks the player to put down the revolt in the Abebaal Egg Mine. Its leader Eleedal-Lei is marked
    # either way: his answer in "slave rebellion" leads to 15, and the ways to 100 kill him. The way to 50 fetches the
    # key to his bracers in Tel Branora, which journal 15 mentions first.
    - stages: 10
      next: 15

  HT_SloadSoap:
    # Journal 10 asks for five portions of sload soap for Arara Uvulas, who gave gold to buy them. Her answer that
    # leads to 100 follows her question whether the player has the five. Sload soap is placed 11 times, so the way
    # marks whoever holds some, such as a chest in Ashmelech and a crate in the test cell "ToddTest". The way is
    # hidden. Arara is marked once the player carries five. Townsfolk of Sadrith Mora point to Anis Seloth's shop,
    # and she sells the soap, so she is an optional hint.
    - stages: 10
      hide: 100
      targets:
        - { task: talk, object: anis seloth, optional: true, done: { carried: ingred_sload_soap_01, atLeast: 5 } }
        - { task: talk, object: arara uvulas, after: { carried: ingred_sload_soap_01, atLeast: 5 }, done: { quest: HT_SloadSoap, atLeast: 100 } }

  HT_SpyBaladas:
    # At 70 all three questions have been asked, and Mallam Ryon's line in "three questions" that leads to 100 needs
    # stage 70. Baladas Demnevanni's fuller answer in "Dwemer language" that leads to 71 is a side step.
    - stages: 70
      next: 100
      optional: 71

  HT_Stronghold:
    # Llunela Hleran's answer in "Dwemer Animunculi" that leads to 210 needs the rank of Master, and the way to 270
    # fetches the book "Secrets of Dwemer Animunculi" from Galom Daeus. The analysis can't see the rank, so both are
    # ways from every stage. Journal 5 only sends the player to Llunela, whose answer in "stronghold" leads to 10.
    - stages: 5
      next: 10
    # Journals 10 and 20 ask for Duke Vedam Dren's construction contract and two strong souls. Llunela's answer that
    # leads to 50 needs her local variable hasSoul. The script StrongSoulCheck sets it from her greeting, when the
    # player holds the souls. Until then that way is left out, along with its fetch of the contract that Vedam Dren
    # carries. So the default rule would mark only the book in Galom Daeus. Vedam Dren, placed in the Grand Council
    # Chambers in Ebonheart, is marked until the player has the contract. Then Llunela is optional, because the
    # markers can't tell whether the souls are ready. Her answer in "strong souls" that hands out the soul gems (20)
    # stays marked at 10.
    - stages: 10-20
      hide: [210, 270]
      targets:
        - { task: talk, object: vedam dren, done: { carried: bk_stronghold_c_hlaalu } }
        - { task: talk, object: llunela hleran, optional: true, after: { carried: bk_stronghold_c_hlaalu },
            done: { quest: HT_Stronghold, atLeast: 50 } }
    # Journals 50, 90 and 170 come before a few days of building. The scripts Strong_Build_Start_T, Strong_Build1_T
    # and Strong_Build2_T then set 55, 100 and 200. Nothing is left to do meanwhile.
    - stages: [50, 90, 170]
      hide: [210, 270]
    # Journal 55 sends the player to Llunela, whose answer in "stronghold" leads to 60.
    - stages: 55
      next: 60
    # Journal 60 sends the player to the foreman Gashnakh gra-Mughol at Uvirith's Grave. His greeting leads to 70.
    - stages: 60
      next: 70
    # At 70 the foreman asked the player to tell Llunela that the work goes well. Her answer leads to 90.
    - stages: 70
      next: 90
    # At 100 and 105 the first stage is finished, and Llunela's answer in "stronghold" that leads to 110 offers the
    # next one.
    - stages: 100-105
      next: 110
    # Journal 110 asks for 5000 gold and the Dwemer schematics from Mzanchend. Llunela's line that leads to 170
    # needs both the schematics and the gold, so its way is left out while playing until the player carries the
    # gold. The schematics misc_dwrv_artifact70 are placed in "Mzanchend" and in "Mark's Script Testing Cell",
    # which no door leads into, so that copy gets no marker. A fetch target marks the copy in the ruin until the
    # player has it, and Llunela is marked once they also carry the gold.
    - stages: 110
      hide: [170, 210, 270]
      targets:
        - { task: fetch, object: misc_dwrv_artifact70, done: { carried: misc_dwrv_artifact70 } }
        - { task: talk, object: llunela hleran, after: [{ carried: misc_dwrv_artifact70 }, { carried: gold_001, atLeast: 5000 }],
            done: { quest: HT_Stronghold, atLeast: 170 } }
    # At 200 the second stage is finished. Llunela offers the last stage to a Master in "stronghold", and her answer
    # in "Dwemer Animunculi" names the book (210). The book is not yet known.
    - stages: 200
      next: 210

  HT_TheranaClothes:
    # Journal 10 asks the player to deliver the skirt to Therana in Tel Branora. No line sets 50. Therana's greeting
    # that leads to 70 needs the player to wear the skirt, so it is left out while playing. The way to 72 has her
    # slave Ra'Zahr wear it, which no journal suggests before 72. That way is hidden, and Therana is marked until
    # the skirt is dealt with.
    - stages: 10-50
      hide: 72
      targets:
        - { task: talk, object: therana, done: { quest: HT_TheranaClothes, atLeast: 70 } }
    # At 70 the player wore the skirt and Therana attacked. Felisa Ulessen's answer that leads to 100 needs stage 70.
    # Getting the slave to wear it is no longer needed.
    - stages: 70
      next: 100

  MV_AbusedHealer:
    # Hlormar Wine-Sot's greeting sets 1, which has no journal entry, and his topic "festering witch" leads to 10.
    # Journal 10 says he wants help finding the witch, and his answers in the same topic lead to 30 if the player
    # helps and to 35 if not. At both stages the default rule also marks Cloudcleaver, which Sosia Caristiana
    # carries, through the way to 85 at the end of the quest. So it points at the witch before anyone has mentioned
    # her.
    - stages: [1, 10]
      next: [10, 30, 35]
    # Journal 30 says Hlormar now follows the player to the witch's camp to the northwest. Sosia's topics "Hlormar"
    # and "Cloudcleaver" lead to 40 and 50. The default rule also marks the axe and then Hlormar beside the player,
    # through the way to 85 at the end of the quest.
    - stages: 30
      next: [40, 50]
    # Journal 50 gives Sosia's offer, and Hlormar's answers in "Sosia's offer" lead to 60 or 70, as the player
    # sides with him or with her. The default rule also marks the axe, and so Sosia, as if she had to be robbed.
    - stages: 50
      next: [60, 70]
    # Journal 75 closes the player's part: Sosia thanked the player for protecting her from Hlormar. Hlormar's
    # answers that lead to 80 and 85 are for the side that fought with him, so they are left out.
    - stages: 75
      hide: [80, 85]

  MV_AngryTrader:
    # Journals 5 and 10 are about meeting Tinos Drothan. His topic "stole all my goods" leads to 20. The default
    # rule also marks the two guards in Beshara and the raw glass there, which the journal only names at 20.
    - stages: [5, 10]
      next: 20
    # Journal 20 asks the player to kill both guards, Alvur Hleran and Dondir, and bring back the glass. They are
    # placed in Beshara, and the glass is in a chest there. Tinos's line that leads to 110 needs the glass and both
    # guards dead. The default rule also marks Tinos at once, through his answer that leads to 23. That answer
    # comes with the choice in the same conversation, and accepting is not needed to finish.
    - stages: [20, 23]
      next: 110

  MV_BanditVictim:
    # Journal 30 says the player agreed to bring back Aeta Wave-Breaker's ring and amulet. Dro'zhirr carries both
    # in Shushishi, and Aeta's line that leads to 100 takes them. The default rule also marks Dro'zhirr to talk to,
    # through his answer in "Nord woman" that leads to 50. That is a bargain over the reward, which the journal
    # doesn't offer. He is still marked as the one who carries the jewels.
    - stages: 30
      next: 100

  MV_BountyHunter:
    # Journal 10 is about meeting Daric Bielle. His topic "Stupid slaves" leads to 20. The default rule also marks
    # his guide Hides His Eyes, through the way to 110. The guide is the escaped slave Haj-Ei, and journal 80 is the
    # first to say so.
    - stages: 10
      next: 20
    # Journal 20 is Daric's story. His line in "Stupid slaves" that sets 20 offers the choice that leads to 30 or
    # 40. The default rule also marks Hides His Eyes, for the reason above.
    - stages: 20
      next: [30, 40]
    # Journal 30 says Haj-Ei hides somewhere around Suran. Anyone in Suran can answer "Haj-Ei", which leads to 50
    # or 60. The default rule also marks Hides His Eyes, through the way to 110.
    - stages: 30
      next: [50, 60]
    # Journal 40 says the player turned the job down. Nothing is marked.
    - stages: 40
      hide: 50-130
    # Journal 50 says no one in Suran knew much. Asking more people in Suran leads to 60.
    - stages: 50
      next: 60
    # Journals 60 and 65 send the player to the slaver Dranas Sarathram. His answer in "Haj-Ei" leads to 70. The
    # default rule also marks Hides His Eyes.
    - stages: [60, 65]
      next: 70
    # Journal 70 says Dranas knows the Argonian language. His answer in "Not his real name" leads to 80. The default
    # rule also marks Hides His Eyes.
    - stages: 70
      next: 80
    # Journals 80 and 90 tell the player that Hides His Eyes is Haj-Ei. The player can confront him, which leads to
    # 110, or tell Daric, which leads to 140. The default rule marks Daric and Dranas, through Dranas's line in
    # "Haj-Ei" that leads to 100, and leaves out Hides His Eyes.
    - stages: [80, 90]
      next: [110, 140]

  MV_CultistVictim:
    # Journal 10 is about meeting Sason. His topics "taken by cultists" and "unholy ritual" lead to 20 and 30. The
    # default rule marks only his wife Malexa in the shrine of Ashalmawia, through her lines that lead to 15 and 35,
    # and the journal hasn't sent the player there.
    - stages: 10
      next: 30
    # Journal 15 is about finding Malexa held in the shrine. Her topic "unholy ritual" leads to 35, where she asks
    # for help. The default rule also marks Sason, whom the journal doesn't name.
    - stages: 15
      next: 35

  MV_DeadTaxman:
    # Journal 10 is about finding the corpse of the tax collector with his tax record. Socucius Ergalla, whose ID is
    # chargen class, takes the record in "murder of Processus Vitellius", which leads to 20. The default rule also
    # marks Processus's ring on Foryn Gilnith and the lighthouse keeper Thavere Vedrano, who are named much later.
    - stages: 10
      next: 20
    # Journal 20 says Socucius asked about the 200 gold. His answers lead to 30, 40 or 45. The default rule also
    # marks the ring and Thavere.
    - stages: 20
      next: [30, 40, 45]
    # Journal 40 says the player kept the gold and Socucius let the matter drop. No bounty was offered. Nothing is
    # marked.
    - stages: 40
      hide: 45-90
    # Journal 45 says the player admitted losing the gold, and must bring Socucius the 200 gold. His line that takes
    # it leads to 46 and 48 and needs 200 gold carried, so while playing it is left out until the player has the
    # gold. The default rule would then mark Foryn Gilnith and the ring he carries, through the ways to 70 and 90,
    # before anyone has named him. So those ways are hidden, and Socucius is marked once the player has the gold.
    - stages: 45
      hide: 70-90
    # Journal 48 gives the bounty on the murderer. Anyone in Seyda Neen but Thavere can answer "murder of Processus
    # Vitellius", which leads to 50. The default rule also marks the ring on Foryn Gilnith, the murderer.
    - stages: 48
      next: 50
    # Journal 50 sends the player to Thavere Vedrano in the lighthouse. Her topic "seen him get angry" leads to 60.
    # The default rule also marks the ring on Foryn Gilnith.
    - stages: 50
      next: 60
    # Journal 85 says the player chose to punish Foryn, who now fights. The way to 100 kills him and reports to
    # Socucius. Returning the ring to Thavere, which leads to 90, is a side step that she asked for at 60.
    - stages: 85
      next: 100
      optional: 90
    # At 90 the ring is back with Thavere. The only way on is to report Foryn's death to Socucius, which leads to
    # 100. A player who believed Foryn at 80 has no reason to kill him, so Socucius is only marked once Foryn is
    # dead.
    - stages: 90
      hide: 100
      targets:
        - { task: talk, object: chargen class, after: { dead: foryn gilnith },
            done: { quest: MV_DeadTaxman, atLeast: 100 } }

  MV_FakeSlave:
    # Journal 10 is about meeting Tul. His topic "aid a poor Argonian" leads to 20 or 25. The default rule also
    # marks Sterdecan's farm. Tul's script tulScript sets 60 only when Tul himself gets near Sterdecan, so the farm
    # is pointless until Tul follows the player.
    - stages: 10
      next: [20, 25]
    # Journal 20 says Tul wants to reach Sterdecan's farm. His answers lead to 40, where he follows the player, or to
    # 50. The farm is not marked until he follows.
    - stages: 20
      next: [40, 50]
    # Journal 25 says Tul wants to find an abolitionist. His answers lead to 45, where he follows the player, or to
    # 50. The farm and the locals who know of it are not marked until he follows.
    - stages: 25
      next: [45, 50]
    # Journal 40 says Tul follows the player to Sterdecan's farm. tulScript sets 60 when Tul gets near Sterdecan.
    # The default rule also marks Tul beside the player, through his answer that leads to 50.
    - stages: 40
      next: 60
    # Journal 45 says Tul follows the player while they look for an abolitionist whose home the player doesn't know.
    # Drolora Salen and Serer Andrano, placed near Tul, answer "kindly Redguard", which leads to 55 and names
    # Sterdecan. The default rule marks Sterdecan before anyone has named him.
    - stages: 45
      next: 55

  MV_InnocentAshlanders:
    # Journal 10 is about Marsus Tullius, who was robbed. His topic "thieving Ashlanders" leads to 20. The default
    # rule also marks the hides, carried by Tinti and Hairan in the Erabenimsun Camp, through the way to 105,
    # before the journal names them.
    - stages: 10
      next: 20
    # Journal 20 is Marsus's request. His line in "thieving Ashlanders" that sets 20 offers the choice that leads to
    # 30 or 40. The default rule also marks the hides, as at 10.
