        - { task: talk, object: odral helvi, after: { carried: bk_landdeed_hhrd }, done: { quest: HH_ReplaceDocs, atLeast: 100 } }
    # At 50 Crassius has taken the fake deed, so the way to Rovone Arvel, which fetches it, can't be done. Crassius
    # told the player to still bring the old deed to Odral.
    - stages: 50
      hide: 55

  HH_Retaliation:
    # Journal 5 only records finding Ralen Hlaalo's body, and ralenHlaaloScript adds the topic "Ralen Hlaalo".
    # Nileno Dorvayn's lines in that topic, which lead to 10 and 15, take up the case. The servant Uryne Nirith is
    # placed in Hlaalo Manor, where the body lies. Her answer in "Ralen Hlaalo" offers the murderer's description,
    # whose line leads to 50 and needs nothing. The journal names neither woman, so both are optional. The rumor
    # about Nine-Toes (30) and the townsfolk's lines (60) are hidden. So are Nileno's reward lines, which would
    # mark Thanelen Velas and Nine-Toes to be killed.
    - stages: 5
      optional: [10, 15, 50]
      hide: [30, 60-200]
    # Journals 10 and 15 ask the player to find the murderer. Nileno's line that leads to 10 gives a key to Hlaalo
    # Manor, where the servant Uryne Nirith is placed. Her answer in "murderer's description" leads to 50. Hlaalu
    # members in Balmora answer "Ralen Hlaalo" by sending the player to her. Journals 30 and 40 are the rumor
    # about Nine-Toes and his denial, so she is still the lead. The ways to 100 to 150 kill one of the suspects
    # before the journal has pointed at either. Nileno's line that leads to 200 needs town_balmora at 30 or more, for a player who already
    # killed Thanelen Velas for Larrius Varro.
    - stages: 10-40
      next: [50, 200]
    # Journal 50 gives the murderer's description. Townsfolk in Balmora answer "murderer's description" by naming
    # Thanelen Velas, which leads to 60. Nileno's line that leads to 200 needs town_balmora at 30, so for most
    # players it is left out while playing. The default rule would then mark the reward lines that kill the
    # suspects. So only the townsfolk are marked, and Nileno is optional for a player who already killed Thanelen
    # for Larrius Varro.
    - stages: 50
      next: 60
      optional: 200
    # Journal 60 says Thanelen Velas at the Council Club fits the description. Nileno's lines that lead to 100, 110,
    # 120 and 200 are said only to Hlaalu members. Her lines that lead to 150 are for everyone else, and need either
    # suspect dead. The ways to 100, 120 and 150 would mark Nine-Toes, whom the journal has cleared, so they are
    # hidden. Thanelen is marked to kill, and Nileno once he is dead, for members and others alike.
    - stages: 60
      hide: [100, 120, 150]
      targets:
        - { task: kill, object: thanelen velas, done: { dead: thanelen velas } }
        - { task: talk, object: nileno dorvayn, after: { dead: thanelen velas }, done: { quest: HH_Retaliation, atLeast: 100 } }

