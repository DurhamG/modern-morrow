      next: 50
    # Journal 50 records that the mail was returned. Varus's line in "Chrysamere" that leads to 60 has no conditions
    # and names the next relic. The default rule also marks Draramu Hloran, who carries Chrysamere, through the way
    # to 100, but no journal names her until 60.
    - stages: 50
      next: 60

