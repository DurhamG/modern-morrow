# Hand-made corrections to the quest markers, for Morrowind, Tribunal and Bloodmoon.
#
# The game works out each stage's ways forward from the content files. A way is a line of dialogue or a script
# that moves a quest's journal to a higher index. Some of those ways are side steps that shouldn't be marked, such
# as someone who only gives directions. This file says, at the stages that need it, which ways to mark. Quests and
# stages not listed here keep the default rule.
#
# Each quest has a list of entries. The keys of an entry are:
#   stages    The journal indices the entry is for: an index, a range such as 10-20, or a list of them.
#   next      Mark only the ways that lead to these journal indices. Failures among them, such as killing someone
#             who talks in the quest, are only marked when every one of them is a failure. If none of them is left
#             after the checks made while playing, such as when the person to talk to has died, the default rule
#             chooses instead.
#   optional  Mark the ways that lead to these journal indices as optional: side steps the player can take or leave.
#             They are drawn hollow and smaller on the maps, and the compass leaves them out.
#   hide      Never mark the ways that lead to these journal indices. The default rule chooses among the rest.
#   targets   Mark these too, for steps that no line or script in the content names, such as the people a journal
#             entry sends the player to. Each has a task (talk, kill, fetch or visit), an object or a cell, and
#             optionally a count, optional: true for a side step, and conditions. The target is marked once its
#             after condition holds, or all of them when after is a list, and until its done condition holds.
#             Without them, it is marked as long as the entry applies. A condition is one of
#             { quest: ID, atLeast: N }, { quest: ID, started: true }, { quest: ID, finished: true },
#             { dead: ID } for someone who has died, { carried: ID } for an item the player carries, with
#             atLeast: N for several of it, and
#             { global: NAME, atLeast: N } for a global variable.
#   follow    Quests that help with this one, such as one for each person the journal sends the player to. While
#             one has started and not finished, what it marks is marked too, even if the player doesn't track it.
#
# The file holds no text for players, only quest IDs, journal indices, object IDs and cell names. An entry that
# names anything the loaded content doesn't have is left out, with a warning in the log, so a mod that renumbers a
# quest gets the default rule rather than wrong markers.
#
# The comments say where each fact comes from in the content files: journal entries, lines of dialogue with their
# speakers, conditions and results, and where objects are placed.

version: 1

# The fingerprint of each corrected quest: a hash of its journal indices and of who and what moves it on, from which
