quests:

  A1_1_FindSpymaster:
    # At stage 1 the default rule marks Elone, whose line leads to 2, and Caius Cosades, whose lines lead to 11, 12
    # and 14. Journal 1 tells the player to report to Caius in Balmora, and to ask at the South Wall Cornerclub
    # where he lives. Elone's line in the topic "Balmora" has no conditions and only gives directions. Anyone in
    # the cell "Balmora, South Wall Cornerclub" can say the line that leads to 5. Caius's answers to "Report to
    # Caius Cosades" lead to 11, 12 and 14, and need only A1_2_AntabolisInformant below 1, so they work from stage 1.
    - stages: 1-2
      next: 14
      optional: 5
    # Journal 5 names Bacola Closcius as someone who knows where Caius lives. His line in the topic "Caius Cosades"
    # leads to 10. Caius is placed once, in his house in Balmora, and the player can go straight there.
    - stages: 5
      next: 14
      optional: 10

  A1_V_VivecInformants:
    # Journal 1 sends the player to three informants in Vivec: Addhiranirr in St. Olms, Huleeya at the Black Shalk
    # Cornerclub, and Mehra Milo at the Hall of Wisdom. The only line that moves the quest on is Caius Cosades's
    # report, which needs A1_6_AddhiranirrInformant at 45 or 60, and A1_7HuleeyaInformant and A1_10_MehraMilo at 50
    # or more. So until all three are done the content gives nothing to mark. Each informant starts a quest of their
    # own when the player finds them: A1_6_AddhiranirrInformant at 5, A1_7HuleeyaInformant at 1 and A1_10_MehraMilo
    # at 10. Each is marked until their quest starts, and from then on what their quest marks is marked.
    - stages: 1
      targets:
        - { task: talk, object: addhiranirr, done: { quest: A1_6_AddhiranirrInformant, started: true } }
        - { task: talk, object: huleeya, done: { quest: A1_7HuleeyaInformant, started: true } }
        - { task: talk, object: mehra milo, done: { quest: A1_10_MehraMilo, started: true } }
      follow: [A1_6_AddhiranirrInformant, A1_7HuleeyaInformant, A1_10_MehraMilo]

  A1_2_AntabolisInformant:
    # At stage 1 the default rule marks Hasphat Antabolis and the Dwemer puzzle box in Arkngthand, because the way
    # to 10 fetches the box. Journal 1 only says to talk to Hasphat at the Balmora Fighters Guild and do him a favor.
    # The box is first named in journal 5, which his line in the topic "Favor" sets, with only the condition that
    # the quest has started. So at stage 1 only the way to 5 is marked.
    - stages: 1
      next: 5

  A1_4_MuzgobInformant:
    # Journal 10 asks for the skull of Llevule Andrano from Andrano Ancestral Tomb, where the skull is placed. The
    # default rule also marks Sharn gra-Muzgob in full, because her line in the topic "Andrano Ancestral Tomb" has no
    # conditions and leads to 12. That line only gives directions to the tomb, so it is a side step. Her line in the
    # topic "Errand" that leads to 15 needs the skull, so she is marked in full once the player has it.
    - stages: 10
      next: 15
      optional: 12

  A1_6_AddhiranirrInformant:
    # Journal 5 says Addhiranirr is hiding, probably in the St. Olms underworks. Her line in the topic "Census and
    # Excise agent" leads to 12 and needs only A1_V_VivecInformants at 1 or more. Aldyne Arenim in the waistworks and
    # Sevisa Teran in the canalworks have lines in the topic "Addhiranirr" that lead to 10. They only say where she
    # hides, so they are side steps. Without this entry, Duvianus Platorius would be marked as the furthest way while
    # playing. Addhiranirr's own ways to 56 and 60 need A2_6_Incarnate at 53, which can't hold this early in the
    # main quest, so the way to 53 through Duvianus would be the highest one left.
    - stages: 5
      next: 12
      optional: 10
    # Journal 10 says Addhiranirr hides in the underworks. Her line that leads to 12 needs only
    # A1_V_VivecInformants at 1 or more. Duvianus Platorius, the tax agent, has two answers in the topic
    # "Addhiranirr" with no checks. One leads to 15 and the other to 53, where the player gives her away. Journal 10
    # doesn't name him yet, so only Addhiranirr is marked.
    - stages: 10
      next: 12
    # At 15 the player has sent Duvianus away. Addhiranirr's greeting and her line in the topic "Census and Excise
    # agent" lead to 30, and need only stage 15 or more. While playing, the default rule would also mark Duvianus,
    # through his answer that leads to 53. He is still placed at 15, because only her greeting disables him. Giving
    # her away after sending him off is not a step journal 15 asks for.
    - stages: 15
      next: 30
    # At 30 Addhiranirr is ready to talk. Her line in the topic "Sixth House cult" needs stage 30 exactly and leads
    # to 45. Duvianus's answer that leads to 53 has no checks, and he is still placed when the player reached 30
    # through her topic rather than her greeting, so the default rule would mark him as the furthest way.
    - stages: 30
      next: 45

  A1_7HuleeyaInformant:
    # Huleeya's script HuleeyaFollow sets 20 when he reaches Jobasha's Rare Books while following the player. That
    # follow starts only from his answers in the topic "travel together", which lead to 18. So going to the
    # bookstore before 18 does nothing, and the cell isn't marked until then. With the ways to 20 hidden, the rule
    # marks Huleeya at stage 1, through his topic "troublesome fools" that leads to 2 and his answers that lead to
    # 18. At stage 2 it marks the three men bothering him, Ethys Savil, Favel Gobor and Urven Davor, whose lines in
    # the topic "filthy lizard" lead to 15. It also marks Huleeya, since journal 2 lets the player leave with him and
    # fight instead. At stage 15 it marks Huleeya.
    - stages: 1-15
      hide: 20

  A1_11_ZainsubaniInformant:
    # Journal 20 says Hassour Zainsubani loves poetry, and suggests a bookseller nearby. His lines in the topic
    # "thoughtful gift" lead to 31, 32 and 33 when the player has "Ashland Hymns", "Words of the Wind" or "The Five
    # Far Stars". The default rule also marks him in full through his line that leads to 34, which takes no gift and
    # which journal 20 doesn't offer. Ashland Hymns and Words of the Wind both have a copy in Codus Callonus's
    # bookshop in Ald'ruhn. The Five Far Stars is left out, because one of its three copies is in Skaal Village on
    # Solstheim, and fetch markers show every copy.
    - stages: 20
      next: [31, 32]
    # Journals 31 and 32 say Hassour has accepted a book and will answer questions about the Ashlanders. His line in
    # the topic "Ashlanders" leads to 50 and needs stage 31 or more. The default rule would also mark the next poetry
    # book as a way to 32 or 33, which the player no longer needs.
    - stages: 31-32
      next: 50

  A1_SleepersAwake:
    # The only ways forward are Caius Cosades's line in the topic "attacked while sleeping", which leads to 5, and
    # the visit to Azura's spirit in the Facility Cavern under Red Mountain at the end of the game, which leads to
    # 50. Journal 1 is about a raving Sleeper and asks nothing of the player. The topic for Caius is only added by
    # the Sleepers script when cultists attack the player in bed, which sets 3. So nothing is marked at 1.
    - stages: 1
      hide: [5, 50]
    # At 3 the player was attacked in bed in Balmora, Ald'ruhn or Vivec, and the Sleepers script added the topic
    # Caius answers. Telling him only earns advice, so he is optional. The end of the game is never marked.
    - stages: 3
      optional: 5
      hide: 50
    # Journal 5 suggests finding a nearby cultist base, without naming one. Journal 7 is about an attack by a
    # Sleeper and asks nothing. Neither should point at the end of the game.
    - stages: 5-7
      hide: 50

  A2_1_Kurapli_Zallay:
    # Journal 1 asks the player to find and kill Zallay Subaddamael, who is placed in Zallay's Yurt at
    # Aharasaplit Camp. Kurapli's line in the topic "Zallay Subaddamael" has no conditions and only says where he
    # hides, so it is a side step. Her line in "personal vengeance" that leads to 50 needs Zallay dead.
    - stages: 1
      next: 50
      optional: 10

  A2_1_MeetSulMatuul:
    # Journal 1 sends the player to Urshilaku Camp to speak with its leaders. Any Ashlander in Urshilaku Camp can
    # answer "Nerevarine prophecies" and send the player on to Zabamund, which leads to 20. The line that leads to 5
    # is said by anyone in Maar Gan, and only gives directions to the camp. Zabamund's lines lead to 35 from
    # stage 1, but the journal hasn't named him yet. Nibani Maesa's line in "Sleepers" that leads to 53 from here
    # needs C3_DestroyDagoth at 50 or more, so it only holds after the main quest ends.
    - stages: 1
      next: 20
      optional: 5
    # Journals 5, 11 and 13 leave the player on the way to the camp, or in it after killing an Ashlander. Talking
    # to an Ashlander in Urshilaku Camp still leads to 20. Zabamund's lines to 35 are left out for the reason above.
    - stages: [5, 11, 13]
      next: 20
    # At 20, 35 and 42 the only way to 53 is Nibani Maesa's "Sleepers" line that needs C3_DestroyDagoth at 50 or
    # more, which is the end of the main quest. Her other "Sleepers" lines need this quest at 45 or more. Journal 20
    # sends the player to Zabamund, 35 to Sul-Matuul, and 42 to the burial caverns for the bow.
    - stages: [20, 35, 42]
      hide: 53
    # Journal 40 asks for Sul-Senipul's bow from the Urshilaku Burial Caverns. Sul-Matuul takes the bow in the topic
    # "initiation rite", which leads to 45. His line in "Urshilaku burial caverns" has no conditions and only gives
    # directions, leading to 42.
    - stages: 40
      next: 45
      optional: 42

  A2_2_6thHouse:
    # Journals 1 and 2 tell the player to come back to Caius Cosades when ready. Caius's answer in "Orders" that
    # leads to 5 needs A2_1_MeetSulMatuul at 60 or more, which holds once this quest has started. Dagoth Gares is
    # disabled until that answer enables him, and the journal hasn't named him yet.
    - stages: 1-2
      next: 5
    # Journals 5 and 7 tell the player to speak to Raesa Pullia, placed in Buckmoth Legion Fort. Her answer in
    # "Sixth House base" leads to 10 and needs this quest at 5 or more. Caius's line in the same topic leads to 7,
    # and repeats what the player has already been told.
    - stages: [5, 7]
      next: 10
    # From 10 on, the journal's task is to kill Dagoth Gares in Ilunibi. His lines in the topics "Dagoth Ur",
    # "Ilunibi shrine", "Sixth House", "Sixth House servants", "our enemy" and "Lord's friendship" lead to 40 to 49.
    # They are talk the player can skip. The script CorprusOnPC on him sets 50 when he dies. With the talk left
    # out, the kill is the only way left, so it is marked.
    - stages: 10-48
      hide: [40, 42, 44, 46, 48, 49]

  A2_3_CorprusCure:
    # Journal 1 sends the player to Divayth Fyr at Tel Fyr. Caius's line in "Tel Fyr", which leads to 5, only
    # gives directions, and the player has just spoken to him. Caius gave the player the Dwemer artifact that
    # Divayth Fyr's lines ask for.
    - stages: 1
      optional: 5
    # Journal 25 sends the player to Yagrum Bagarn in the Corprusarium Bowels for the boots. His line in "Dwemer
    # boots" leads to 40. Divayth Fyr's answers in "potion" lead to 46 and 50, and need only this quest at 25 or
    # more, but the journal says to bring the boots first. Journals 28, 30 and 32 are notes about the inmates and
    # come before the boots.
    - stages: 25-32
      next: 40

  A2_3_CorprusKiller:
    # Journals 10 and 20 record that the player killed an inmate of the Corprusarium. Divayth Fyr's greetings
    # that lead to 30 each need a different inmate dead, so the default rule marks every inmate still alive as
    # one to kill. The player has nothing to do here. Divayth Fyr forgives the player in a greeting the next time
    # they meet, and A2_3_CorprusCure marks him anyway.
    - stages: 10-20
      hide: 30

  A2_3_CorprusSafe:
    # Journal 10 asks the player to search for a guarskin drum around the Corprusarium. The drum misc_de_drum_02
    # is placed 34 times, too many to mark, so the fetch marks the one creature that carries one, the scamp
    # Creeper in Ghorak Manor in Caldera. That is far from where the journal points. Uupse Fyr, placed in the
    # Corprusarium Bowels, takes the drum in the topic "guarskin drum", which leads to 100. She stays marked until
    # the drum is handed over.
    - stages: 10
      hide: 100
      targets:
        - { task: talk, object: uupse fyr, done: { quest: A2_3_CorprusSafe, atLeast: 100 } }

  A2_4_MiloGone:
    # Journal 1 sends the player to Mehra Milo at the Hall of Wisdom, and says to look for a message under the code
    # word 'amaya' if something has gone wrong. Caius's "Orders" line has already moved her to the Ministry of
    # Truth's holding cells and enabled the note bk_notetoamaya in Milo's Quarters. Reading the note leads to 10.
    # Gilvas Barelo's answer in "lost prophecies" leads to 50 from stage 1, but the journal hasn't named him yet.
    - stages: 1
      next: 10
    # Journal 10 sends the player to Alvela Saram, placed in the Vivec Temple. Her answers in "visit anyone" lead
    # to 15.
    - stages: 10
      next: 15
    # Journal 15 sends the player into the Ministry of Truth to free Mehra Milo. Her answer in "Divine
    # Intervention scrolls" takes a scroll and leads to 20. That way fetches sc_divineintervention first, and the
    # only placed copies lie in the far-off dungeons Ashir-Dan, Shal and Thelas Ancestral Tomb, which no journal
    # mentions. Journal 10 already told the player to bring the scrolls, and traders sell them. So the way is
    # hidden, and Mehra Milo is marked until she reaches 20. Gilvas Barelo's lines to 49 and 50 come later.
    - stages: 15
      hide: 20-50
      targets:
        - { task: talk, object: mehra milo, done: { quest: A2_4_MiloGone, atLeast: 20 } }
    # Journal 20 sends the player to Blatta Hateria at the East Docks in Ebonheart, where she is placed, and then
    # to Vevrana Aryon at the Holamayan dock. Vevrana Aryon's greeting leads to 22. Blatta Hateria's answer in
    # "go fishing" starts A2_4_Milo_hola_go instead of moving this quest on, and the player then still has to ask
    # her for the boat ride. So she stays marked until Vevrana Aryon greets the player at Holamayan.
    - stages: 20
      next: 22
      targets:
        - { task: talk, object: blatta hateria, done: { quest: A2_4_MiloGone, atLeast: 22 } }

  A2_6_Incarnate:
    # Journal 1 has Nibani Maesa send the player away until some days have passed, and journal 3 says it is time to
    # go back to her. Her "My judgement" answer leads to 5 once her local day count reaches 2, so while the player
    # waits nothing is marked. The script NibaniWaitOneDay that would set 3 is never started, so stage 1 usually
    # lasts until then. Sul-Matuul's "Third trial" answers that lead to 10 belong after her judgement, and the
    # Moon-and-Star in the Cavern of the Incarnate (50) is a spoiler: neither has been mentioned yet.
    - stages: 1-3
      hide: [10, 50]
    # Journal 5 sends the player to Sul-Matuul, whose "Third trial" answer leads to 10. The Cavern hasn't been
    # mentioned yet.
    - stages: 5
      hide: 50
    # Journal 10 asks for three tokens from Kogoruhn, to bring to Sul-Matuul. His answer that leads to 15 comes after
    # a "Third trial" line that needs misc_goblet_dagoth, shadow_shield and ingred_corprus_weepings_01, but the
    # analysis doesn't see those item conditions, so no line names the tokens as steps. The goblet is placed in
    # "Kogoruhn, Dome of Pollock's Eve" and the shield in "Kogoruhn, Bleeding Heart". The corprus weepings are left
    # out, because they are placed in several unrelated cells. One lies in the goblet's room, and the journal says to
    # take them from a corprus beast. The Cavern is still unknown at this stage.
    - stages: 10
      hide: 50
      targets:
        - { task: fetch, object: shadow_shield, done: { quest: A2_6_Incarnate, atLeast: 15 } }
        - { task: fetch, object: misc_goblet_dagoth, done: { quest: A2_6_Incarnate, atLeast: 15 } }
    # Journal 15 sets the riddle and tells the player to ask the tribes for counsel. The Ashlanders' answers about the
    # riddle lead to 20 and 22, and Nibani Maesa's answer to "the star is the key" leads to 26. Marking the
    # Moon-and-Star in the Cavern (50) would give the riddle's answer away before the player has any lead. Only the
    # Ashlanders' answers say where to look, in the Valley of the Wind. Nibani's answer needs only stage 15, and
    # from 26 on the Cavern is marked, so going to her first would skip that lead. She is optional counsel here.
    - stages: 15
      hide: 50
      optional: 26
    # Journals 20, 22 and 24 come from Ashlanders who place the riddle in the Valley of the Wind, at the Needle and
    # Airan's Teeth. The Cavern of the Incarnate lies there, so it is the place the journal now points to. More
    # Ashlander answers (22, 24) and Nibani Maesa's answer about the star (26) remain as optional counsel.
    - stages: 20-24
      next: 50
      optional: 22-26
    # Journals 26 and 28 come from Nibani Maesa's answers about when the door can be seen. Her next answer, to "the
    # dream is the door" (28) or "mouth of the cave" (29), only adds detail, so it is optional. The Cavern is marked
    # as the goal, which fits a player who heard the Ashlanders at 20 to 24 first, as the markers at 15 lead them
    # to. A player can also reach 26 straight from 15 through Nibani. The journal index never drops back to 20 to
    # 24, so the two players can't be told apart, and for the second one the Cavern gives away where it lies.
    - stages: 26-28
      next: 50
      optional: 28-29

  B2_AhemmusaSafe:
    # Journals 1, 4, 5, 10 and 15 tell the player to go to Ald Daedroth and make it safe before coming back to
    # Sinnammu Mirpal. Hlireni Indavel, placed in "Ald Daedroth, Antechamber", is the priestess there. Her "Player of
    # the Game" answers lead to 20 by persuasion and to 25 or 30 by threat. Sinnammu's own topics (5, 10, 15) only
    # explain the task. Going back to her with the statue as the goal (40) comes after the shrine is safe. If Hlireni
    # is dead, such as when the player cleared the shrine by force, her ways are left out and the default rule
    # chooses among the rest, which include going back to Sinnammu.
    - stages: 1-15
      next: [20, 25, 30]
    # Journals 20, 25 and 30 say Hlireni Indavel has promised her followers won't harm the Ahemmusa. The next step is
    # to return to Sinnammu Mirpal in the Ahemmusa Camp and bring her to the statue in "Ald Daedroth, Inner Shrine".
    # Her script mirpalFollow sets 40 only while she follows the player, which her "accompany you" answer starts
    # along with B2_AhemmusaWalk at 10. So going to the shrine alone does nothing, and the ways to 40 are hidden.
    # Sinnammu is marked until B2_AhemmusaWalk starts, and from then on that quest marks the statue. Hlireni's other
    # answers (25, 30) are already behind the player. Hlireni warns in those answers that she can't speak for the
    # Ordinators. The Ordinators' "who are you" answer, which leads to 35, is a side step that keeps them peaceful.
    # Journal 35 records that talk, and the step after it is the same.
    - stages: 20-35
      hide: [25-30, 40]
      optional: 35
      targets:
        - { task: talk, object: sinnammu mirpal, done: { quest: B2_AhemmusaWalk, started: true } }
      follow: [B2_AhemmusaWalk]

  B2_AhemmusaWalk:
    # Journal 10 says Sinnammu Mirpal is following the player to the inner shrine of Ald Daedroth. Her "accompany you"
    # answer gives her a follow package to "Ald Daedroth, Inner Shrine". Her script mirpalFollow then sets
    # B2_AhemmusaSafe to 40 near the statue active_dae_sheogorath_ad, which is placed there. This quest has no
    # line or script of its own that moves it on, so the statue is a target until B2_AhemmusaSafe reaches 40.
    - stages: 10
      targets:
        - { task: visit, object: active_dae_sheogorath_ad, done: { quest: B2_AhemmusaSafe, atLeast: 40 } }

  B3_ZainabBride:
    # Journal 1 says Ashkhan Kaushad scoffed, and that raising his disposition might help, without naming anyone.
    # Kaushad's choice lines in the topic "Nerevarine" lead to 5 at disposition 70, so asking him again is the
    # main way. Sonummu Zabamat's line in "Counsel" leads to 3 and is only a tip, so it is optional. The way to 4
    # needs the exquisite shoes that only her tip reveals. The way to 47 is FaluraScript, which runs only while
    # Falura Llervu follows the player, long after this.
    - stages: 1
      next: 5
      optional: 3
    # Journal 3 tells the player to bring Kaushad exquisite shoes. His line in "exquisite shoes" leads to 4.
    - stages: 3
      next: 4
    # Journal 4 records the gift. Asking Kaushad about "Nerevarine" again leads to 5.
    - stages: 4
      next: 5
    # Journal 5 sets the task of killing the vampire Calvario in Nerano Ancestral Tomb, where he is placed. Kaushad's
    # line that offers the choice leading to 20 and 22 needs Calvario dead, but no line or script names the kill.
    # The answer to that choice has no check on Calvario, so Kaushad's ways would mark him from the start. They are
    # hidden, and Kaushad is a target to report back to once Calvario is dead. The way to 47 is the escort at the
    # end of the quest.
    - stages: 5
      hide: [20, 22, 47]
      targets:
        - { task: kill, object: calvario, done: { quest: B3_ZainabBride, atLeast: 20 } }
        - { task: talk, object: kaushad, after: { dead: calvario }, done: { quest: B3_ZainabBride, atLeast: 20 } }
    # From 20 to 40 the next step is each time one person or one set of items: Kaushad, Sonummu Zabamat in
    # "Counsel", Savile Imayn and the exquisite clothes, the bug musk, then Falura Llervu with the presents. The way
    # to 47 is FaluraScript, which only moves the quest while Falura follows the player after 45, so marking her and
    # Kaushad's yurt before then gets ahead of the journal.
    - stages: 20-40
      hide: 47

  B4_KillWarLovers:
    # Journal 5 says to kill Ulath-Pal and the gulakhans Ahaz, Ranabi and Ashu-Ahhe, and then see Manirai. Her line in
    # "Nerevarine prophecies" leads to 10 once all four are dead. That way counts as a failure, because Ulath-Pal
    # speaks a line of this quest, so the default rule marks Han-Ammu's lines instead. Those need the tokens the
    # four carry and only come after 10. With them hidden, the kills are the only way left, and they are marked.
    - stages: 5
      hide: [35, 40, 41, 42, 43]
    # Journal 10 sends the player to persuade Han-Ammu in his yurt, and warns he will be hard to persuade. His lines
    # in "want to be ashkhan" need one of the tokens that Ahaz, Ranabi and Ulath-Pal carried, which the journal
    # hasn't mentioned. Without a token he only refuses. Each of those ways marks the token first, so Han-Ammu is a
    # target here until he accepts. The token ways are optional, so the dead chiefs who carry the tokens get hollow
    # markers as a hint.
    - stages: 10
      optional: [35, 40-43]
      targets:
        - { task: talk, object: han-ammu, done: { quest: B4_KillWarLovers, atLeast: 35 } }
    # Journals 35 and 40 to 43 all say to ask Han-Ammu to name the player Nerevarine at once. His line in "name you
    # Nerevarine" leads to 50. The other ways give him more tokens, which is no longer needed.
    - stages: 35-43
      next: 50

  B5_ArobarHort:
    # Journal 5 says Miner Arobar will never vote for the player after a councilor was killed. The councilor scripts
    # set RedoranMurdered when one dies, and it never resets. Arobar's lines for it come first in "Redoran
    # Hortator", so he gives no other answer from then on, and nothing can be done.
    - stages: 5
      hide: [10, 20, 50, 60]
    # Journal 10 is the same dead end, for a murder.
    - stages: 10
      hide: [20, 50, 60]
    # At 20 Arobar waits for the other councilors. His line leading to 50 needs B5_SarethiHort at 50. The choice
    # leading to 60 needs a rank in House Redoran, and the journal never suggests it. At 50 he has already confirmed
    # the player, so the way to 60 is only another wording of the same outcome.
    - stages: [20, 50]
      hide: 60

  B5_LlethriHort:
    # Journal 5 says Garisa Llethri refuses after a councilor was killed. His lines for RedoranMurdered come first in
    # "Redoran Hortator" and the variable never resets, so nothing can be done.
    - stages: 5
      hide: [10, 20, 50, 60]
    # Journal 10 is the same dead end, for a murder.
    - stages: 10
      hide: [20, 50, 60]
    # At 20 Llethri will talk to the other councilors. His line leading to 50 needs B5_SarethiHort at 50. The choice
    # leading to 60 needs House Redoran membership, which the journal never suggests. At 50 he has already confirmed
    # the player.
    - stages: [20, 50]
      hide: 60

  B5_MorvaynHort:
    # Journal 5 says Brara Morvayn refuses after a councilor was killed. Her lines for RedoranMurdered come first in
