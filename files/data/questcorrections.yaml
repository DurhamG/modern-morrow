      hide: 25-55
    # Journal 5, 20 and 25 all point at Archcanon Saryoni in his quarters at the High Fane. His answer to
    # "Temple's doctrine" with choice 4 gives the keys and leads to 30. The Ordinators' line in "your plan",
    # which leads to 20, is only a warning the player can skip. Vivec isn't named until journal 30.
    - stages: 5-25
      next: 30

  B8_Nibani_2_Vivec:
    # Nibani Maesa's lines in "Seven trials", "Sixth trial" and "Seventh trial" start this quest once the player is
    # Hortator and Nerevarine. Journal 1 sends the player to Saryoni to ask for a meeting with Vivec, and no line
    # moves this quest on. B8_MeetVivec covers that meeting, from Danso Indules to Saryoni to Vivec, so its markers
    # are followed. Saryoni, placed in "Vivec, High Fane", is marked for the rare case where B8_MeetVivec hasn't
    # started, since his "Temple's doctrine" line to B8_MeetVivec 30 doesn't need it.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, started: true } }
      follow: [B8_MeetVivec]

  C0_Act_C:
    # This quest records each ash vampire killed (1 to 7) and each of Kagrenac's tools found (10 for Keening, 15 for
    # Sunder). The scripts ouch_keening and ouch_sunder set 10 and 15 when the player first holds the item. The
    # analysis reads those as visits to the items. Keening lies in "Odrosal, Tower", but Sunder isn't placed: the
    # creature dagoth vemyn carries it, in "Vemynal, Hall of Torque". So the default rule never shows Sunder, and
    # shows nothing at all once 10 or 15 is reached, even while the other tool is still missing. Fetching each
    # tool marks where it lies or who carries it, until the player holds it. Both stop once C3_DestroyDagoth
    # reaches 20, when the Heart is destroyed. A vampire can be killed, or a tool found, long before anyone sends
    # the player for the tools. Vivec does that in B8_MeetVivec, which ends at 50 or 55. On the back path, Yagrum
    # Bagarn starts CX_BackPath at 1 after reading the plans of Vivec and Dagoth Ur that the player brings him. So
    # the tools are marked only once one of those two quests has got that far.
    - stages: 1-20
      targets:
        - { task: fetch, object: sunder, after: { quest: B8_MeetVivec, atLeast: 50 },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: keening, after: { quest: B8_MeetVivec, atLeast: 50 },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: sunder, after: { quest: CX_BackPath, started: true },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: keening, after: { quest: CX_BackPath, started: true },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }

  C0_Act_C_Expo:
    # The Buoyant Armigers at Ghostgate start this quest in "inside the Ghostfence", which needs B8_MeetVivec at 50
    # or more. B8_MeetVivec finishes at 50 or 55, where Vivec sends the player for Sunder in Vemynal and Keening in
    # Odrosal, and then to the Heart in Dagoth Ur's citadel. No quest marks those steps until C3_DestroyDagoth
    # starts at 5, when the player speaks with Dagoth Ur. Sunder is carried by dagoth vemyn in "Vemynal, Hall of
    # Torque" and Keening lies in "Odrosal, Tower". Each tool is marked until the player holds it or the Heart is
    # destroyed at C3_DestroyDagoth 20. Vivec's order is Sunder first, then Keening, and only then the Heart. So the
    # door into "Dagoth Ur, Outer Facility" is marked once the player carries Keening, the second tool, and until
    # C3_DestroyDagoth starts. A target's after condition can test only one item, so a player who takes Keening
    # first sees the door while Sunder is still marked.
    - stages: 1
      targets:
        - { task: fetch, object: sunder, done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: keening, done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: visit, cell: "Dagoth Ur, Outer Facility", after: { carried: keening },
            done: { quest: C3_DestroyDagoth, started: true } }

  C3_DestroyDagoth:
    # Dagoth Ur's last answer in "final questions" sets 5 and starts the fight. The only way the analysis finds from
    # 5 and 10 is the AzuraEnd script on "azura spirit", which ends the game at 50 and only appears once the Heart
    # is destroyed at 20, so marking it is a spoiler. Journal 5 says the fight comes next. The creature dagoth_ur_1
    # is placed in "Dagoth Ur, Facility Cavern" and is marked until the quest reaches 10, when he flees.
    - stages: 5
      hide: 50
      targets:
        - { task: kill, object: dagoth_ur_1, done: { quest: C3_DestroyDagoth, atLeast: 10 } }
    # Journal 10 says to destroy the enchantments on the Heart of Lorkhan. The Heart is the creature
    # heart_akulakhan, placed in "Akulakhan's Chamber". The EndGame script sets 20 once it is struck down.
    - stages: 10
      hide: 50
      targets:
        - { task: kill, object: heart_akulakhan, done: { quest: C3_DestroyDagoth, atLeast: 20 } }

  CX_BackPath:
    # Yagrum Bagarn starts this quest at 1 in "mythopoeic enchantments". Journal 1 asks for Kagrenac's Planbook and
    # Kagrenac's Journals. The way to 25 fetches both. The journals lie in "Endusal, Kagrenac's study", and the
    # planbook is in the desk dwrv_desk_tureynul in "Tureynulal, Kagrenac's Library". Yagrum's answers in
    # "Kagrenac's Planbook" and "Kagrenac's Journals" lead to 5 and 10, but only say he doesn't know where the books
    # are. They are side steps.
    - stages: 1
      optional: [5, 10]
    # At 5 the answer in "Kagrenac's Journals", leading to 10, is still a side step.
    - stages: 5
      optional: 10

  FG_AlofsFarm:
    # Journal 10 sends the player to Alof the Easterner at his farm, who saw Orcs at a ruin nearby. His answer in
    # "Orcs at a Daedric ruin" has no conditions and leads to 30, where he names Ashunartes and the leader Burub
    # gra-Bamog. The default rule also marks Burub, through the ways to 50 and 100 that need him dead, before the
    # journal has named him.
    - stages: 10
      next: 30

  FG_BeneranBounty:
    # Journal 10 says Nerer Beneran hides in the cavern of Sargon, where he is placed. The Scouts in Maar Gan answer
    # "Sargon" with directions and ShowMap Vas, which leads to 50. Persius Mercius's own "Sargon" answer suggests
    # asking there, so it is a side step, and the kill stays the goal.
    - stages: 10
      next: 100
      optional: 50

  FG_BigBosses:
    # Journal 10 asks the player to kill Gentleman Jim Stacey in Simine Fralinie's bookstore. Sjoring Hard-Heart's
    # choices in "master thief" that lead to 110 come from his line for a player who is already Master Thief, which
    # needs rank 9 in the Thieves Guild. The analysis doesn't see that rank, so the default rule marks Sjoring from
    # the start as the furthest way.
    - stages: 10
      next: 100

  FG_CorprusStalker:
    # Berwen starts this quest at 1 herself, in "Corprus Stalker", when the player offers to kill the beast. Journal
    # 1 names only Berwen. Her line that leads to 89 needs this quest at 1 and corprus_stalker_fgcs dead, and the
    # stalker is placed in her shop. The default rule marks Hrundi instead of her, through his line that leads to
    # 10 and needs FG_DissaplaMine at 100, and his line that leads to 100 once the stalker is dead. Journal 1
    # doesn't mention him.
    - stages: 1
      next: 89

  FG_DebtStoine:
    # Journal 10 says Lirielle Stoine at The Rat in the Pot owes the client 2000 gold. Her answer in "debt money"
    # leads to 50. Lorbumol gro-Aglakh's choice that leads to 100 is only offered when the player carries 2000 gold,
    # which the analysis doesn't see, so the default rule marks him at once.
    - stages: 10
      next: 50
    # Journal 50 says Lirielle's brother Ruran Stoine died in Mallapi. Ruran Stoine is placed in Mallapi and
    # carries 500 gold and a random amount more. His record has no health, so he lies there dead, and a dead actor
    # gets no marker. No line names the cave as a step, so the cave Mallapi is an optional target until the debt is
    # paid. Lorbumol stays marked, because his line takes 2000 gold from wherever it came.
    - stages: 50
      targets:
        - { task: visit, cell: "Mallapi", optional: true, done: { quest: FG_DebtStoine, atLeast: 100 } }

  FG_DeseleDebt:
    # Journal 10 asks the player to get the 200 gold from Helviane Desele in Suran. Her answer in "debt money"
    # leads to 70. The default rule marks Persius Mercius, whose line leads to 30, and the journal doesn't mention
    # him. It also marks Eydis Fire-Eye, whose choice that leads to 100 is only offered at stage 30 or more with
    # 200 gold carried.
    - stages: 10
      next: 70

  FG_DissaplaMine:
    # Journal 10 says to do what Novor Drethan in the Dissapla Mine asks. His answers in "Dissapla Mine" lead to 30
    # and need stage below 30. Teres Arothan's answer in "travel together" leads to 50, but the journal hasn't
    # named him yet.
    - stages: 10
      next: 30
    # Journal 55 records that Teres Arothan died. The escort script teresArothanScript that sets 70 only runs
    # while Teres follows the player, so the visit to Novor Drethan leads nowhere. Hrundi's lines that lead to 110
    # need Teres or Novor dead, so they count as failures. Marking them would also mark Novor as one to kill. So
    # only Hrundi is marked, as the one to report to.
    - stages: 55
      hide: [70, 110]
      targets:
        - { task: talk, object: hrundi, done: { quest: FG_DissaplaMine, atLeast: 110 } }

  FG_Egg_Poachers:
    # Journal 1 asks the player to kill Sevilo Othan and Daynila Valas, placed in Shulk Egg Mine, and report back
    # to Eydis Fire-Eye. Her answer in "Shulk Egg Mine" that leads to 10 only gives directions to the mine, so it
    # is a side step.
    - stages: 1
      next: 100
      optional: 10

  FG_KhajiitBounty:
    # Journal 10 says Dro'Sakhar hides in Vivec, probably in St. Olms, and he is placed in St. Olms Canal
    # South-Two. Journal 30 gives that house, though no line sets 30. Persius Mercius's answer in "Dro'Sakhar"
    # leads to 60 and only says the bounty is lawful. Neither journal mentions him, so his way is left out.
    - stages: [10, 30]
      hide: 60

  FG_KillCronies:
    # Journal 10 asks the player to kill Eydis Fire-Eye and report to Persius Mercius. His line in "Eydis Fire-Eye"
    # that leads to 40 needs her dead. His line in "Lorbumol gro-Aglakh" that leads to 15 has no conditions, and
    # the ways to 60 and 100 need Lorbumol gro-Aglakh dead, whom journal 10 doesn't name. The stages 40 and 60 have
    # no journal entry. With those ways hidden, Eydis is marked, then Persius.
    - stages: 10
      hide: [15, 60-100]

  FG_Nchurdamz:
    # Journals 10 and 11 send the player to Larienna Macrina at Nchurdamz. Her choice in "explore together" that
    # leads to 20 needs stage 10 or 11. The default rule also marks the Daedroth daedroth_fg_nchur, whose script
    # BILL_FG_Hrelvesuu sets 90 when it dies. Journal 20 is the first to mention the beast.
    - stages: [10, 11]
      next: 20
    # Journals 55 and 60 record that Larienna died and say to tell Hrundi. His line in "Nchurdamz" that needs her
    # dead leads to 110. It counts as a failure, so the default rule marks the Daedroth instead. Killing it sets 90,
    # but Hrundi's line for her death still comes first.
    - stages: [55, 60]
      next: 110

  FG_SilenceTaxgirl:
    # Journal 10 gives a bounty on Adraria Vandacia, placed in the Census and Excise Warehouse in Seyda Neen.
    # Persius Mercius's answer in "Adraria Vandacia" leads to 50, but the journal doesn't mention him, and the
    # default rule marks him solid as the lowest way.
    - stages: 10
      hide: 50

  FG_SuranBandits:
    # Journal 10 sends the player to Avon Oran in Suran. His answer in "bandits in Suran" leads to 30 and needs
    # FG_BeneranBounty at 100, which held when this quest started. The default rule also marks the kill of Daldur
    # Sarys, whom journal 30 names first.
    - stages: 10
      next: 30

  FG_Telasero:
    # At 50 Sondaale of Shimmerene follows the player, and the script sondaaleFollow sets 70 once the player has
    # left both "Telasero, Lower Level" and "Telasero, Upper Level" with her. So the goal is the way out. The
    # exterior cell outside the dungeon is named "Telasero", so a visit to it marks the first door on the way out.
    # The way to 70 would only mark Sondaale beside the player. Hrundi's line that leads to 110 needs her dead, and
    # with the way to 70 hidden it would be the only way left, so it is hidden too.
    - stages: 50
      hide: [70, 110]
      targets:
        - { task: visit, cell: "Telasero", done: { quest: FG_Telasero, atLeast: 70 } }
    # At 70 Sondaale of Shimmerene is at the entrance of Telasero. Her greeting that leads to 75 only thanks the
    # player. Hrundi pays the contract in "Sondaale of Shimmerene" from 70 on, so he stays the goal.
    - stages: 70
      next: 100
      optional: 75

  FG_TenimBounty:
    # Journal 10 says Rels Tenim was last seen near Vos. The farmers in Vos answer "Rels Tenim" with a pointer to
    # the Ahemmusa Camp, and journal 40 says the same, though no line sets 40. Anyone in the Ahemmusa Camp can
    # answer "Rels Tenim" with the way to Shallit, which leads to 60. The default rule also marks Rels Tenim in
    # Shallit, which the journal only names at 60. The camp is marked from 10, though journal 10 names only Vos,
    # because the farmers' pointer sets no stage, so no condition could clear a marker on Vos once they have answered.
    - stages: [10, 40]
      next: 60

  FG_Vas:
    # Journal 10 asks the player to aid Ulyne Henim at Vas. Her answer in "fight together" leads to 50. The default
    # rule also marks the Necromancer Daris Adram, through the ways to 80 and 85 that need him dead. Journal 50 is
    # the first to name him.
    - stages: 10
      next: 50

  MG_Advancement:
    # Journal 10 says to pay the guild dues. The answer in "Advancement" that leads to 20 takes the 200 gold. The
    # ways to 60 and 70 are about the Wizard's Staff, which the journal only asks for at 50.
    - stages: 10
      next: 20
    # At 20 the dues are paid and the rank is raised. The line that leads to 50 only comes when the player meets the
    # next rank's requirements, and the staff ways to 60 and 70 aren't mentioned yet, so there is nothing to go to.
    - stages: 20
      hide: [50, 60, 70]
    # Journal 50 asks for a Wizard's Staff without saying where. A senior guild member sells one in the topic
    # "Wizard's Staff", which leads to 60. The way to 70 fetches one of the two placed staffs, in "Ramimilk,
    # Shrine" and "Urshilaku, Laterus Burial", which no journal entry mentions, so it is hidden. A staff found
    # anywhere is still accepted in the same topic, from the same guild members the way to 60 marks.
    - stages: 50
      hide: 70

  MG_Apprentice:
    # Journal 10 asks the player to stop the disturbance at Huleen's hut in Maar Gan. The scamp scamp_mg_apprentice is
    # placed there, and Edwinna Elbert's line in "Huleen's hut" that leads to 20 needs it dead. Her answers to the
    # choice that leads to 100 and 200 come after a line that needs Listien Bierles dead, so they count as failures
    # and are left out. Listien hides in the same hut, and his lines that lead to 40 also need the scamp dead. The
    # journal hasn't named him, so he is optional.
    - stages: 10
      next: 20
      optional: 40

  MG_Bethamez:
    # Journal 10 sends the player to the lower levels of the Gnisis Eggmine, into the Dwemer ruin of Bethamez, for
    # the plans. The plans misc_dwrv_artifact20 are placed in "Gnisis, Bethamez", but also in "Tel Vos, Central
    # Tower" and in "Bamz-Amschend, Hall of Wails", and the fetch would mark all three. So the ruin is marked until
    # the player carries the plans, and then Edwinna Elbert, who takes them in the topic "Bethamez".
    - stages: 10
      hide: 100
      targets:
        - { task: visit, cell: "Gnisis, Bethamez", done: { carried: misc_dwrv_artifact20 } }
        - { task: talk, object: edwinna elbert, after: { carried: misc_dwrv_artifact20 }, done: { quest: MG_Bethamez, atLeast: 100 } }

  MG_Dwarves:
    # Journal 10 says Trebonius gave almost nothing to go on. The way to 70 fetches the three books
    # bk_eggoftime, bk_divinemetaphysics and bk_hanginggardenswasten from Mzuleft, Bethamez and Nchuleftingth, and
    # takes them to Baladas Demnevanni or Yagrum Bagarn. No journal entry names the books' places or the two
    # translators. Edwinna Elbert, Hasphat Antabolis and Divayth Fyr only hint at them once the player holds a book.
    # Marking them would give the whole search away, so nothing is marked.
    - stages: 10
      hide: 70

  MG_EscortScholar1:
    # Tenyeminwe's script tenyeminweFollow sets 70 near Gals Arethi, but only while she follows the player. The
    # follow starts with her answer in "travel together", which leads to 30. So the docks aren't marked until then.
    - stages: 10
      hide: 70
    # Once she follows the player, the next step is Gals Arethi's ship at the docks, where the script sets 70.
    # Skink-in-Tree's-Shade's line in "Tenyeminwe" that leads to 100 needs only stage 50 or more, so at 50 the
    # default rule would also mark him before she is safe.
    - stages: 30-50
      next: 70
    # Journal 70 says Tenyeminwe reached the ship, and the player should report to Skink, whose line leads to 100.
    # Her answer in "travel together" that leads to 80 is a reward the player can skip.
    - stages: 70
      next: 100
      optional: 80

  MG_Excavation:
    # Journals 1 and 10 send the player to Senilias Cadiusus in Nchuleftingth. His answers in "excavation report"
    # and "Anes Vendu" lead to 20 and 30. The default rule also marks the report bk_seniliasreport and Edwinna Elbert,
    # through the way to 100, but the journal doesn't mention the report being lost until 20 and 30. At 1 it would
    # also mark Edwinna's line that starts her own errand to 10. Journal 20 says the report is late, and Senilias's
    # answer in "Anes Vendu" leads to 30.
    - stages: 1-20
      next: [20, 30]
    # Journal 30 asks the player to find out what happened to Anes Vendu in the lower levels, and journal 40 says
    # his body was found. The report is carried by Anes Vendu, placed in "Nchuleftingth, Lower Levels". Senilias,
    # who asked, takes it in "excavation report" and leads to 50, and journal 50 then sends the player to Edwinna.
    # The default rule marks Edwinna instead of Senilias once the report is found.
    - stages: 30-40
      next: 50

  MG_Guildmaster:
    # Journal 10 says Edwinna Elbert asked the player to talk to Trebonius, whose answer in "Arch-Mage" leads to 50.
    # Skink-in-Tree's-Shade's line in "duties" that leads to 20 is another start of this quest, which the journal
    # doesn't mention.
    - stages: 10
      next: 50
    # Journal 50 sets a duel with Trebonius in the Arena. vivecArenaScript, on a ring placed in "Vivec, Arena Pit",
    # moves him into the pit when the player enters it at this stage. treboniusScript only sets 100 when he dies
    # with the player in the Arena. The analysis marks him in the Vivec guild hall, where killing him does nothing
    # for the quest. The pit is marked instead.
    - stages: 50
      hide: 100
      targets:
        - { task: visit, cell: "Vivec, Arena Pit", done: { quest: MG_Guildmaster, atLeast: 100 } }

  MG_KillNecro2:
    # Journal 10 asks the player to kill Tashpi Ashibael in her hut in Maar Gan. Her lines in "necromancy" and
    # "plan" lead to 40 and 50, where she offers to flee instead. Stage 40 has no journal entry. The kill is set
    # aside as a failure because she speaks in the quest. Ranis Athrys's answer that leads to 100 without a death is
    # the player's lie, which comes after a line that needs this quest at 40, and the analysis doesn't see that. So
    # Tashpi is marked, and once she is dead the default rule marks Ranis.
    - stages: 10-40
      next: 40-50

  MG_Mzuleft:
    # Journal 10 sends the player to the ruins of Mzuleft for scarab plans. The plans misc_dwrv_artifact10 are placed
    # in "Mzuleft", but also in "Dagon Fel, Vacant Tower" and "Tel Vos, Central Tower", and the fetch would mark all
    # three. So Mzuleft is marked until the player carries the plans, and then Edwinna Elbert, who takes them in the
    # topic "blueprints".
    - stages: 10
      hide: 100
      targets:
        - { task: visit, cell: "Mzuleft", done: { carried: misc_dwrv_artifact10 } }
        - { task: talk, object: edwinna elbert, after: { carried: misc_dwrv_artifact10 }, done: { quest: MG_Mzuleft, atLeast: 100 } }

  MG_PayDues:
    # Journal 10 sends the player to Manwe in Punabi to collect her dues, and Ranis Athrys said to kill her if
    # she won't pay. Manwe's lines in "Guild Dues" lead to 40 and 50. Ranis's answer that leads to 100 by paying
    # the dues yourself comes after a line that needs this quest at 30 and 2000 gold, which the analysis doesn't see.
    # Journal 30 says Manwe refuses, and still points at her. If Manwe is dead, her ways are left out, and the
    # default rule marks Ranis.
    - stages: [10, 30]
      next: [40, 50]

  MG_Potion:
    # Journal 10 sends the player to Skink-in-Tree's-Shade in Sadrith Mora for the potion. His answers in
    # "Detect Creatures Potion" lead to 50 and give the potion. His line in "Ancestral Tomb", which leads to 30, is
    # unrelated. The way to 100 would mark the seven placed copies of p_detect_creatures_s, in shrines and ruins.
    - stages: 10
      next: 50

  MG_ReturnBook:
    # Journal 10 asks the player to return Chimarvamidium to the Vivec guild. Edwinna Elbert told the player to put
    # it back where it was found, in the chest de_p_chest_02_sirilonwe. Her line that leads to 100 needs her local
    # bookInBox at 1, which is set once the book is back in the chest. Until then the default rule marks Sirilonwe,
    # whose answer in "Chimarvamidium" takes the book and leads to 30. Without this entry it would also mark the
    # chest after the book is back, through the way to 30.
    - stages: 10
      next: 100

  MG_Sabotage:
    # Journal 10 asks the player to put the fake soul gem in Galbedir's desk. Ajira's line that leads to 100 needs
    # her local gemInDesk at 1, set once the gem is in the desk, so nothing is marked until then. The desk
    # de_p_desk_01_galbedir is placed in "Balmora, Guild of Mages", in the same hall as Ajira.
    - stages: 10
      targets:
        - { task: visit, object: de_p_desk_01_galbedir }

  MG_Science:
    # Journal 10 asks for a Dwemer Tube from Arkngthunch-Sturdumz. The tube misc_dwrv_artifact60 is placed 20 times,
    # so the fetch would mark the containers that carry one: com_chest_02_ra'zhid, de_p_desk_hlevala and
    # dwrv_chest_fals. So the ruin is marked until the player carries a tube, and then Edwinna Elbert, who takes it
    # in the topic "Dwemer Tube".
    - stages: 10
      hide: 100
      targets:
        - { task: visit, cell: "Arkngthunch-Sturdumz", done: { carried: misc_dwrv_artifact60 } }
        - { task: talk, object: edwinna elbert, after: { carried: misc_dwrv_artifact60 }, done: { quest: MG_Science, atLeast: 100 } }

  MG_Sharn_Necro:
    # Journal 1 says Sharn gra-Muzgob denies being a necromancer. Her answers in "necromancers" that lead to 10
    # come after a line that needs her book bk_sharnslegionsofthedead, so that way fetches the book first. The book
    # is in her chest de_r_chest_01_sharn, and it is first named in journal 10, so marking the chest gives it away.
    # The other way to 10 needs Random100 at 101, which never holds. Asking her again only repeats the denial, so
    # nothing is marked until the player holds the book, and then Sharn.
    - stages: 1
      hide: 10
      targets:
        - { task: talk, object: sharn gra-muzgob, after: { carried: bk_sharnslegionsofthedead }, done: { quest: MG_Sharn_Necro, atLeast: 10 } }

  MG_SoulGem2:
    # Journal 10 asks for the soul of an ash ghoul, and names Yakin as the nearest place with one. Skink-in-Tree's-
    # Shade's line that leads to 100 needs his local soulAshGhoul at 1, so nothing is marked until the soul is
    # caught. The creature ash_ghoul is placed twice, both in "Yakin". Each is marked until it dies.
    - stages: 10
      targets:
        - { task: kill, object: ash_ghoul }

  MG_SpyCatch:
    # Journal 10 asks the player to question guild members in Ald'ruhn, Vivec and Sadrith Mora. Trebonius's answer in
    # "credentials" leads to 80, but the player only learns to ask him from Tiram Gadar in the Vivec hall. The way
    # to 110, where the player accuses Ranis Athrys to Trebonius in "Telvanni spy", needs this quest at 80. The way
    # to 100 needs the credentials. So the three guild halls are marked until the player has the credentials.
    - stages: 10
      hide: [80, 100, 110]
      targets:
        - { task: visit, cell: "Ald-ruhn, Guild of Mages", done: { quest: MG_SpyCatch, atLeast: 80 } }
        - { task: visit, cell: "Vivec, Guild of Mages", done: { quest: MG_SpyCatch, atLeast: 80 } }
        - { task: visit, cell: "Sadrith Mora, Wolverine Hall: Mage's Guild", done: { quest: MG_SpyCatch, atLeast: 80 } }
    # Journal 35 says Ranis Athrys believes there is another spy, in Vivec or Sadrith Mora.
    - stages: 35
