      next: 50
    # Journal 20 says Crassius wants the ebony taken to Segunivus Mantedius at Fort Buckmoth instead.
    - stages: 20
      next: 60
    # At 50 the ebony is delivered, so the way to Segunivus can't be done. Odral Helvi's line leads to 100.
    - stages: 50
      next: 100
    # At 60 Segunivus has disabled Odral Helvi and Drinar Varyon, and Crassius Curio's line leads to 110.
