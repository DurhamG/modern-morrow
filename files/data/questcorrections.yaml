    # Journal 10 asks the player to find the shrine of Malacath on Sheogorad and donate four daedra hearts. The
    # script shrineDagonFel on the statue active_dae_malacath_df, placed in Sheogorad, takes four hearts and sets
    # 100. The analysis sees only the fetch of ingred_daedras_heart_01, which is placed 17 times, so it marks the
