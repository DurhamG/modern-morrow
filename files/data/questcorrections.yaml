      next: [50, 60]
    # Journal 50 says Llovyn can't pay. Manat Varnan-Adda is still to be asked.
    - stages: 50
      next: 60
    # Journal 60 says Manat can't pay either. Journal 10 told the player to kill farmers who refuse, which is
    # Odral Helvi's line that leads to 110 once both are dead. Manat said he would take the matter to Rovone Arvel,
    # whose line leads to 65, so Rovone is optional.
    - stages: 60
      next: 110
      optional: 65
    # Journal 65 says Rovone gave the player the money for the rent. Odral Helvi's answer leads to 100.
    - stages: 65
      next: 100

