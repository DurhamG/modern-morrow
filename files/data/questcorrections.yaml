    # he always refuses, and the gift answers can't be reached.
    - stages: 5
      hide: [50, 60, 65]
    # At 50 and 60 Curio has voted. His gift answers that lead to 60 and 65 come in two kinds. One kind needs
    # B6_BeroHort, B6_OmaniHort, B6_UlesHort and B6_YnglingHort at 50 or more, and hands over the belt through
    # B6_HlaaluHort 50. The other kind has no checks and only repeats his vote, for more gold. Both kinds lead to the
    # same stages, so the repeat vote would keep him marked from the moment he voted. Those ways are hidden. The belt
    # step is marked by B6_HlaaluBook once all five councilors have voted.
    - stages: [50, 60]
      hide: [60, 65]

  B6_HlaaluBook:
    # Nileno Dorvayn hands over the Yellow Book in the topic "Hlaalu councilors" (stage 1). Journal 1 says the book
    # lists the councilors and their homes. Her line to 30 only says whom to see first, for a 50 gold bribe, so it is a
    # side step. Journal 30 names Crassius Curio. Each councilor's own quest starts when the player asks them about
    # "Hlaalu Hortator": B6_CurioHort, B6_OmaniHort, B6_UlesHort and B6_YnglingHort. Dram Bero is left out, because
    # Journal 50 of B6_BeroHort says that finding his home is the test. B6_HlaaluHort has only its finishing stage.
    # Crassius Curio's line in "Hlaalu Hortator" that hands over the belt and sets it to 50 needs all five councilor
    # quests at 50 or more. So he is marked again once all five have voted. If he votes last, his own vote hands over
    # the belt, and the first target marks him for it.
    - stages: [1, 30]
      optional: 30
      targets:
        - { task: talk, object: crassius curio, done: { quest: B6_CurioHort, started: true } }
        - { task: talk, object: velanda omani, done: { quest: B6_OmaniHort, started: true } }
        - { task: talk, object: nevena ules, done: { quest: B6_UlesHort, started: true } }
        - { task: talk, object: yngling half-troll, done: { quest: B6_YnglingHort, started: true } }
        - { task: talk, object: crassius curio, done: { quest: B6_HlaaluHort, atLeast: 50 },
            after: [{ quest: B6_BeroHort, atLeast: 50 }, { quest: B6_CurioHort, atLeast: 50 },
                    { quest: B6_OmaniHort, atLeast: 50 }, { quest: B6_UlesHort, atLeast: 50 },
                    { quest: B6_YnglingHort, atLeast: 50 }] }
      follow: [B6_BeroHort, B6_CurioHort, B6_OmaniHort, B6_UlesHort, B6_YnglingHort]

  B6_OmaniHort:
    # Stage 5 comes from Velanda Omani's lines in the topic "Hlaalu Hortator" that need another councilor dead. They
    # come before every other line of hers in the topic, so she refuses from then on.
    - stages: 5
      hide: [20, 50]
    # Journal 20 says she won't vote without Orvas Dren's approval. Orvas Dren, in Dren's Villa, gives it in the topic
    # "Hlaalu Hortator", which sets B6_DrenHortator to 50. Her lines that lead to 50 need B6_DrenHortator at 50, or
    # HH_WinCamonna at 50, or Orvas Dren dead. The way through his death marks him to be killed, which no journal
    # entry suggests, and it leads to the same stage as the others, so all ways to 50 are hidden. Orvas Dren is marked
    # to talk to until he agrees. Velanda Omani is marked to come back to once he has agreed, or once he is dead.
    - stages: 20
      hide: 50
      targets:
        - { task: talk, object: orvas dren druglord, done: { quest: B6_DrenHortator, atLeast: 50 } }
        - { task: talk, object: velanda omani, after: { quest: B6_DrenHortator, atLeast: 50 } }
        - { task: talk, object: velanda omani, after: { dead: orvas dren druglord } }

  B6_UlesHort:
    # Stage 5 comes from Nevena Ules's lines in the topic "Hlaalu Hortator" that need another councilor dead. They
    # come before every other line of hers in the topic, so she refuses from then on.
    - stages: 5
      hide: [20, 50]
    # Journal 20 sends the player to her advisor Orvas Dren. His approval in the topic "Hlaalu Hortator" sets
    # B6_DrenHortator to 50. Her lines that lead to 50 need B6_DrenHortator at 50, or HH_WinCamonna at 50, or Orvas
    # Dren dead. The way through his death marks him to be killed, which no journal entry suggests, and it leads to
    # the same stage as the others, so all ways to 50 are hidden. Orvas Dren is marked until he agrees. Nevena Ules
    # is marked to come back to once he has agreed, or once he is dead.
    - stages: 20
      hide: 50
      targets:
        - { task: talk, object: orvas dren druglord, done: { quest: B6_DrenHortator, atLeast: 50 } }
        - { task: talk, object: nevena ules, after: { quest: B6_DrenHortator, atLeast: 50 } }
        - { task: talk, object: nevena ules, after: { dead: orvas dren druglord } }

  B6_YnglingHort:
    # Stage 5 comes from Yngling Half-Troll's lines in the topic "Hlaalu Hortator" that need another councilor dead.
    # They come before his bribe lines, so he refuses from then on. The way to 70 is his death, which his script
    # writes, and it is set aside as a failure unless it is the only way left.
    - stages: 5
      hide: [10, 20, 50, 70]
    # At 50 he has taken the bribe and voted. The only way left is his death, which leads to 70, so the default rule
    # marks him to be killed after he has already given his vote.
    - stages: 50
      hide: 70

  B7_AryonHort:
    # Aryon's line in the topic "Archmagister Gothren" needs B7_AryonHort at 50 or more and Gothren alive, and adds
    # journal entry 40. The Journal command never lowers a quest's index, so the stage stays at 50 or 55 and 40 is
    # not normally the current stage. If it ever is, his answers that lead to 50 and 55 would only repeat the vote.
    # Journals 40, 50 and 55 all say Aryon advises killing Gothren, who would otherwise put off the vote forever.
    # Gothren is placed once, in the Upper Tower of Tel Aruhn. His marker goes away when he dies.
    - stages: 40
      hide: [50, 55]
      targets:
        - { task: kill, object: gothren }
    # At 50 Aryon has voted. The way to 55 is his other answer to the same question, for the other sex, which can't
    # come up again.
    - stages: 50
      hide: 55
      targets:
        - { task: kill, object: gothren }
    - stages: 55
      targets:
        - { task: kill, object: gothren }

  B7_DrathaHort:
    # Stage 5 comes from Raven Omayn's answer in the topic "Telvanni Hortator" that has no condition on the player's
    # sex. Her answer that leads to 10 needs a male player, and comes first, so a player at 5 is female and can't get
    # it. Journal 5 sends the player to Dratha in Tel Mora.
    - stages: 5
      hide: 10
    # At 50 Dratha has voted. The way to 60 is her answer after the player keeps telling the story, which only comes
    # up when she first refuses to listen.
    - stages: 50
      hide: 60

  B7_GothrenHort:
    # At 50 Gothren has refused for good. The way to 60 is his other refusal in the topic "Telvanni Hortator", which
    # leads to no vote either, so marking him again misleads.
    - stages: 50
      hide: 60

  B7_TelvanniBook:
    # Aryon hands over the Brown Book in the topic "Telvanni councilors" and marks the councilors' towers on the map.
    # Journal 1 says the book lists the councilors and their homes. Each councilor's own quest starts at 5 when their
    # Mouth in the Telvanni Council House sends the player on, or when the player asks the councilor about
    # "Telvanni Hortator" directly: B7_AryonHort, B7_BaladasHort, B7_DrathaHort, B7_GothrenHort, B7_NelothHort and
    # B7_TheranaHort.
    # B7_TelvanniHort has only finishing stages. The councilors' lines in "Telvanni Hortator" that set it to 50 need
    # the global HortatorVotes above 5. The script CountTelvanniHortator counts a vote for each councilor who has
    # voted or died, and for Gothren only once he is dead. It runs only from the greetings of councilors who have
    # voted, so the global lags behind the votes, and a target can't wait for it. So Aryon, whose line also hands over
    # the Robe of the Hortator, is marked once Aryon, Baladas, Dratha, Neloth and Therana have voted and Gothren is
    # dead. The script only needs Baladas's vote when HT_BaladasAlly has made him a councilor, so waiting for it can
    # come late but never early.
    - stages: 1
      targets:
        - { task: talk, object: aryon, done: { quest: B7_AryonHort, started: true } }
        - { task: talk, object: baladas demnevanni, done: { quest: B7_BaladasHort, started: true } }
        - { task: talk, object: dratha, done: { quest: B7_DrathaHort, started: true } }
        - { task: talk, object: gothren, done: { quest: B7_GothrenHort, started: true } }
        - { task: talk, object: neloth, done: { quest: B7_NelothHort, started: true } }
        - { task: talk, object: therana, done: { quest: B7_TheranaHort, started: true } }
        - { task: talk, object: aryon, done: { quest: B7_TelvanniHort, atLeast: 50 },
            after: [{ quest: B7_AryonHort, atLeast: 50 }, { quest: B7_BaladasHort, atLeast: 50 },
                    { quest: B7_DrathaHort, atLeast: 50 }, { quest: B7_NelothHort, atLeast: 50 },
                    { quest: B7_TheranaHort, atLeast: 50 }, { dead: gothren }] }
      follow: [B7_AryonHort, B7_BaladasHort, B7_DrathaHort, B7_GothrenHort, B7_NelothHort, B7_TheranaHort]

  B8_BackDoor1:
    # Athyn Sarethi's greeting starts this quest when the player is level 20 or more, has reputation 50 or more
    # and has A2_6_Incarnate at 50 or more. The journal sends the player to Archcanon Saryoni at
    # the High Fane, but no line moves this quest on. Saryoni's answer in "Temple's doctrine" that needs the same
    # level, reputation and A2_6_Incarnate checks gives the keys and sets B8_MeetVivec to 30. Saryoni is placed
    # once, in "Vivec, High Fane". He is marked until B8_MeetVivec reaches 30, and B8_MeetVivec's own markers
    # lead on to Vivec from there.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, atLeast: 30 } }
      follow: [B8_MeetVivec]

  B8_BackDoor2:
    # The same back door as B8_BackDoor1, started by Crassius Curio's greeting under the same checks.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, atLeast: 30 } }
      follow: [B8_MeetVivec]

  B8_BackDoor3:
    # The same back door as B8_BackDoor1, started by Divayth Fyr's greeting under the same checks.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, atLeast: 30 } }
      follow: [B8_MeetVivec]

  B8_BackDoor4:
    # The same back door as B8_BackDoor1, started by Mehra Milo's greeting under the same checks.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, atLeast: 30 } }
      follow: [B8_MeetVivec]

  B8_BackDoor5:
    # The same back door as B8_BackDoor1, started by Gilvas Barelo's greeting under the same checks.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, atLeast: 30 } }
      follow: [B8_MeetVivec]

  B8_BackDoor6:
    # The same back door as B8_BackDoor1, started by Nibani Maesa's greeting under the same checks.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, atLeast: 30 } }
      follow: [B8_MeetVivec]

  B8_MeetVivec:
    # Athyn Sarethi starts the quest at 1 in the topic "Redoran Hortator". Journal 1 says to see Danso Indules
    # once the player is both Hortator and Nerevarine. Danso's line in "meet the archcanon" leads to 5 and needs
    # B8_All_Hortator and B8_All_Nerevarine at 50, so it only shows once both are done. The default rule also marks
    # Vivec, whose answers in "business" and "defeat Dagoth Ur" lead to 34 to 55 with no checks but the choice, and
    # Saryoni, whose "Temple's doctrine" answers lead to 25 and 30. The journal hasn't mentioned either meeting yet.
    # The players who can't become Nerevarine reach Saryoni through the B8_BackDoor quests, which mark him.
    - stages: 1
      hide: 25-55
    # Journal 5, 20 and 25 all point at Archcanon Saryoni in his quarters at the High Fane. His answer to
    # "Temple's doctrine" with choice 4 gives the keys and leads to 30. The Ordinators' line in "your plan",
    # which leads to 20, is only a warning the player can skip. Vivec isn't named until journal 30.
    - stages: 5-25
      next: 30

  B8_Nibani_2_Vivec:
    # Nibani Maesa's lines in "Seven trials", "Sixth trial" and "Seventh trial" start this quest once the player is
    # Hortator and Nerevarine. Journal 1 sends the player to Saryoni to ask for a meeting with Vivec, and no line
    # moves this quest on. B8_MeetVivec covers that meeting, from Danso Indules to Saryoni to Vivec, so its markers
    # are followed. Saryoni, placed in "Vivec, High Fane", is marked for the rare case where B8_MeetVivec hasn't
    # started, since his "Temple's doctrine" line to B8_MeetVivec 30 doesn't need it.
    - stages: 1
      targets:
        - { task: talk, object: tholer saryoni, done: { quest: B8_MeetVivec, started: true } }
      follow: [B8_MeetVivec]

  C0_Act_C:
    # This quest records each ash vampire killed (1 to 7) and each of Kagrenac's tools found (10 for Keening, 15 for
    # Sunder). The scripts ouch_keening and ouch_sunder set 10 and 15 when the player first holds the item. The
    # analysis reads those as visits to the items. Keening lies in "Odrosal, Tower", but Sunder isn't placed: the
    # creature dagoth vemyn carries it, in "Vemynal, Hall of Torque". So the default rule never shows Sunder, and
    # shows nothing at all once 10 or 15 is reached, even while the other tool is still missing. Fetching each
    # tool marks where it lies or who carries it, until the player holds it. Both stop once C3_DestroyDagoth
    # reaches 20, when the Heart is destroyed. A vampire can be killed, or a tool found, long before anyone sends
    # the player for the tools. Vivec does that in B8_MeetVivec, which ends at 50 or 55. On the back path, Yagrum
    # Bagarn starts CX_BackPath at 1 after reading the plans of Vivec and Dagoth Ur that the player brings him. So
    # the tools are marked only once one of those two quests has got that far.
    - stages: 1-20
      targets:
        - { task: fetch, object: sunder, after: { quest: B8_MeetVivec, atLeast: 50 },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: keening, after: { quest: B8_MeetVivec, atLeast: 50 },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: sunder, after: { quest: CX_BackPath, started: true },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: keening, after: { quest: CX_BackPath, started: true },
            done: { quest: C3_DestroyDagoth, atLeast: 20 } }

  C0_Act_C_Expo:
    # The Buoyant Armigers at Ghostgate start this quest in "inside the Ghostfence", which needs B8_MeetVivec at 50
    # or more. B8_MeetVivec finishes at 50 or 55, where Vivec sends the player for Sunder in Vemynal and Keening in
    # Odrosal, and then to the Heart in Dagoth Ur's citadel. No quest marks those steps until C3_DestroyDagoth
    # starts at 5, when the player speaks with Dagoth Ur. Sunder is carried by dagoth vemyn in "Vemynal, Hall of
    # Torque" and Keening lies in "Odrosal, Tower". Each tool is marked until the player holds it or the Heart is
    # destroyed at C3_DestroyDagoth 20. Vivec's order is Sunder first, then Keening, and only then the Heart. So the
    # door into "Dagoth Ur, Outer Facility" is marked once the player carries Keening, the second tool, and until
    # C3_DestroyDagoth starts. A target's after condition can test only one item, so a player who takes Keening
    # first sees the door while Sunder is still marked.
    - stages: 1
      targets:
        - { task: fetch, object: sunder, done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: fetch, object: keening, done: { quest: C3_DestroyDagoth, atLeast: 20 } }
        - { task: visit, cell: "Dagoth Ur, Outer Facility", after: { carried: keening },
            done: { quest: C3_DestroyDagoth, started: true } }

  C3_DestroyDagoth:
    # Dagoth Ur's last answer in "final questions" sets 5 and starts the fight. The only way the analysis finds from
    # 5 and 10 is the AzuraEnd script on "azura spirit", which ends the game at 50 and only appears once the Heart
    # is destroyed at 20, so marking it is a spoiler. Journal 5 says the fight comes next. The creature dagoth_ur_1
    # is placed in "Dagoth Ur, Facility Cavern" and is marked until the quest reaches 10, when he flees.
    - stages: 5
      hide: 50
      targets:
        - { task: kill, object: dagoth_ur_1, done: { quest: C3_DestroyDagoth, atLeast: 10 } }
    # Journal 10 says to destroy the enchantments on the Heart of Lorkhan. The Heart is the creature
    # heart_akulakhan, placed in "Akulakhan's Chamber". The EndGame script sets 20 once it is struck down.
    - stages: 10
      hide: 50
      targets:
        - { task: kill, object: heart_akulakhan, done: { quest: C3_DestroyDagoth, atLeast: 20 } }

  CX_BackPath:
    # Yagrum Bagarn starts this quest at 1 in "mythopoeic enchantments". Journal 1 asks for Kagrenac's Planbook and
    # Kagrenac's Journals. The way to 25 fetches both. The journals lie in "Endusal, Kagrenac's study", and the
    # planbook is in the desk dwrv_desk_tureynul in "Tureynulal, Kagrenac's Library". Yagrum's answers in
    # "Kagrenac's Planbook" and "Kagrenac's Journals" lead to 5 and 10, but only say he doesn't know where the books
    # are. They are side steps.
    - stages: 1
      optional: [5, 10]
    # At 5 the answer in "Kagrenac's Journals", leading to 10, is still a side step.
    - stages: 5
      optional: 10

  FG_AlofsFarm:
    # Journal 10 sends the player to Alof the Easterner at his farm, who saw Orcs at a ruin nearby. His answer in
    # "Orcs at a Daedric ruin" has no conditions and leads to 30, where he names Ashunartes and the leader Burub
    # gra-Bamog. The default rule also marks Burub, through the ways to 50 and 100 that need him dead, before the
    # journal has named him.
    - stages: 10
      next: 30

  FG_BeneranBounty:
    # Journal 10 says Nerer Beneran hides in the cavern of Sargon, where he is placed. The Scouts in Maar Gan answer
    # "Sargon" with directions and ShowMap Vas, which leads to 50. Persius Mercius's own "Sargon" answer suggests
    # asking there, so it is a side step, and the kill stays the goal.
    - stages: 10
      next: 100
      optional: 50

  FG_BigBosses:
    # Journal 10 asks the player to kill Gentleman Jim Stacey in Simine Fralinie's bookstore. Sjoring Hard-Heart's
    # choices in "master thief" that lead to 110 come from his line for a player who is already Master Thief, which
    # needs rank 9 in the Thieves Guild. The analysis doesn't see that rank, so the default rule marks Sjoring from
    # the start as the furthest way.
    - stages: 10
      next: 100

  FG_CorprusStalker:
    # Berwen starts this quest at 1 herself, in "Corprus Stalker", when the player offers to kill the beast. Journal
    # 1 names only Berwen. Her line that leads to 89 needs this quest at 1 and corprus_stalker_fgcs dead, and the
    # stalker is placed in her shop. The default rule marks Hrundi instead of her, through his line that leads to
    # 10 and needs FG_DissaplaMine at 100, and his line that leads to 100 once the stalker is dead. Journal 1
    # doesn't mention him.
    - stages: 1
      next: 89

  FG_DebtStoine:
    # Journal 10 says Lirielle Stoine at The Rat in the Pot owes the client 2000 gold. Her answer in "debt money"
    # leads to 50. Lorbumol gro-Aglakh's choice that leads to 100 is only offered when the player carries 2000 gold,
    # which the analysis doesn't see, so the default rule marks him at once.
    - stages: 10
      next: 50
    # Journal 50 says Lirielle's brother Ruran Stoine died in Mallapi. Ruran Stoine is placed in Mallapi and
    # carries 500 gold and a random amount more. His record has no health, so he lies there dead, and a dead actor
    # gets no marker. No line names the cave as a step, so the cave Mallapi is an optional target until the debt is
    # paid. Lorbumol stays marked, because his line takes 2000 gold from wherever it came.
    - stages: 50
      targets:
        - { task: visit, cell: "Mallapi", optional: true, done: { quest: FG_DebtStoine, atLeast: 100 } }

  FG_DeseleDebt:
    # Journal 10 asks the player to get the 200 gold from Helviane Desele in Suran. Her answer in "debt money"
    # leads to 70. The default rule marks Persius Mercius, whose line leads to 30, and the journal doesn't mention
    # him. It also marks Eydis Fire-Eye, whose choice that leads to 100 is only offered at stage 30 or more with
    # 200 gold carried.
    - stages: 10
      next: 70

  FG_DissaplaMine:
    # Journal 10 says to do what Novor Drethan in the Dissapla Mine asks. His answers in "Dissapla Mine" lead to 30
    # and need stage below 30. Teres Arothan's answer in "travel together" leads to 50, but the journal hasn't
    # named him yet.
    - stages: 10
      next: 30
    # Journal 55 records that Teres Arothan died. The escort script teresArothanScript that sets 70 only runs
    # while Teres follows the player, so the visit to Novor Drethan leads nowhere. Hrundi's lines that lead to 110
    # need Teres or Novor dead, so they count as failures. Marking them would also mark Novor as one to kill. So
    # only Hrundi is marked, as the one to report to.
    - stages: 55
      hide: [70, 110]
      targets:
        - { task: talk, object: hrundi, done: { quest: FG_DissaplaMine, atLeast: 110 } }

  FG_Egg_Poachers:
    # Journal 1 asks the player to kill Sevilo Othan and Daynila Valas, placed in Shulk Egg Mine, and report back
    # to Eydis Fire-Eye. Her answer in "Shulk Egg Mine" that leads to 10 only gives directions to the mine, so it
    # is a side step.
    - stages: 1
      next: 100
      optional: 10

  FG_KhajiitBounty:
    # Journal 10 says Dro'Sakhar hides in Vivec, probably in St. Olms, and he is placed in St. Olms Canal
    # South-Two. Journal 30 gives that house, though no line sets 30. Persius Mercius's answer in "Dro'Sakhar"
    # leads to 60 and only says the bounty is lawful. Neither journal mentions him, so his way is left out.
