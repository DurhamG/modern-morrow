    - stages: 1
      targets:
        - { task: talk, object: aryon, done: { quest: B7_AryonHort, started: true } }
        - { task: talk, object: baladas demnevanni, done: { quest: B7_BaladasHort, started: true } }
        - { task: talk, object: dratha, done: { quest: B7_DrathaHort, started: true } }
        - { task: talk, object: gothren, done: { quest: B7_GothrenHort, started: true } }
        - { task: talk, object: neloth, done: { quest: B7_NelothHort, started: true } }
        - { task: talk, object: therana, done: { quest: B7_TheranaHort, started: true } }
      follow: [B7_AryonHort, B7_BaladasHort, B7_DrathaHort, B7_GothrenHort, B7_NelothHort, B7_TheranaHort]

  B8_BackDoor1:
