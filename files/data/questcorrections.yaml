        - { task: visit, object: furn_shrine_vivec_cure_02, done: { quest: TT_FieldsKummu, atLeast: 100 } }
        - { task: visit, object: furn_shrine_vivec_cure_03, done: { quest: TT_Ghostgate, atLeast: 100 } }
        - { task: visit, object: ac_shrine_gnisis, done: { quest: TT_MaskVivec, atLeast: 100 } }
        - { task: visit, object: ac_shrine_palace, done: { quest: TT_PalaceVivec, atLeast: 100 } }
        - { task: talk, object: dremora_ttpc, done: { quest: TT_PuzzleCanal, started: true } }
        - { task: visit, object: ac_shrine_koalcave, done: { quest: TT_RuddyMan, atLeast: 100 } }
        - { task: visit, object: ac_shrine_stopmoon, done: { quest: TT_StopMoon, atLeast: 100 } }
      follow: [TT_PuzzleCanal]

  HH_BankFraud:
    # Journal 5 sends the player to Odral Helvi in Caldera, whose line in "sealed orders" leads to 10. The default
    # rule also marks Rovone Arvel, whose answer that leads to 65 comes after Odral hands over the orders.
    - stages: 5
      next: 10
    # Journal 10 says to deliver the orders to Tenisi Lladri, whose answers lead to 50. Crassius Curio's line that
    # started the quest asked the player to come back to him if Odral's request seemed suspect, and his answer
    # leads to 55, so he is optional. Rovone Arvel (65) and Baren Alen (60) are not named by any journal entry.
    - stages: 10
      next: 50
      optional: 55
    # At 50, 55 and 60 the orders are delivered, and every way to 55, 60 and 65 first fetches orders the player
    # no longer has. Odral Helvi's lines in "sealed orders" lead to 100, or to 110 when they went to the wrong person.
    - stages: 50-60
      hide: 55-65

  HH_BeroSupport:
    # Journals 10, 30 and 40 tell the player to find Dram Bero, who is placed in "Vivec, St. Olms Haunted Manor".
    # His answer in "support on the Council" leads to 50. The default rule also marks his champion Garding to be
    # killed. Killing him while the player is not in the Arena makes gardingScript set 200, where Bero refuses his
    # support.
    - stages: 10-40
      next: 50
    # Journal 50 says to beat Garding without killing him. Bero says to speak with Garding first and then meet him
    # in the Arena. gardingScript sets 70 there when Garding is knocked out, drops below 70 health, or dies, and
    # sets 200 when he dies while the player is not in the Arena. Both kinds of way would mark Garding as someone
    # to kill, so they are hidden. Garding's greeting at the manor only accepts the duel and sets nothing.
    # vivecArenaScript, on a ring placed in "Vivec, Arena Pit", moves him into the pit and starts the fight when
    # the player enters it at this stage. So the pit is marked until the duel is over, and Garding is optional.
    - stages: 50
      hide: [70, 200]
      targets:
        - { task: visit, cell: "Vivec, Arena Pit", done: { quest: HH_BeroSupport, atLeast: 70 } }
        - { task: talk, object: garding, optional: true, done: { quest: HH_BeroSupport, atLeast: 70 } }
    # Journal 70 records the win. Bero's answers in "support on the Council" lead to 100. One of them needs
    # Garding dead, so its way would mark Garding as a kill while he lives, and the way to 200 does the same.
    # Crassius Curio's line that leads to 100 only repeats the news. So the ways are hidden, and Bero is marked
    # until he gives his support.
    - stages: 70
      hide: [100, 200]
      targets:
        - { task: talk, object: dram bero, done: { quest: HH_BeroSupport, atLeast: 100 } }

  HH_BuriedTreasure:
    # Journal 10 says to get the money from Murudius Flaeus in Hla Oad. His lines in "debt money" and
    # "Intimidate Success" lead to 50. Edryno Arethi's answer that leads to 100 takes the 800 gold, which the
    # player only finds out about at 50.
    - stages: 10
      next: 50
    # Journal 50 says the money is in a chest under Fadila's house, and Murudius gave the key. That chest is
    # com_chest_02_hhbt, placed outside in Hla Oad, and it holds 943 gold. No line or script names it, so it is a
    # target until the player reports to Edryno Arethi, who stays marked as well.
    - stages: 50
      targets:
        - { task: visit, object: com_chest_02_hhbt, done: { quest: HH_BuriedTreasure, atLeast: 100 } }

  HH_CaptureSpy:
    # Journal 10 asks the player to find who is stealing the mining contracts, somewhere in Caldera. The default
    # rule marks Elmussa Damori, who is the thief, and the chest in her house that holds the contracts. That gives
    # the answer away. Caldera's townsfolk answer the topic by naming the two newest residents, Irgola the
    # pawnbroker and Elmussa Damori, so both are optional suspects until Elmussa confesses at 40 or 41. Odral
    # Helvi's answers that lead to 100, 110 and 120 need the contracts, so he is marked once the player carries
    # them. No line sets 20, and the same holds there.
    - stages: 10-20
      hide: 40-120
      targets:
        - { task: talk, object: irgola, optional: true, done: { quest: HH_CaptureSpy, atLeast: 40 } }
        - { task: talk, object: elmussa damori, optional: true, done: { quest: HH_CaptureSpy, atLeast: 40 } }
        - { task: talk, object: odral helvi, after: { carried: bk_calderaminingcontract }, done: { quest: HH_CaptureSpy, atLeast: 100 } }
    # At 40 and 41 Elmussa has confessed and given the key. The step left is to take the contracts from her chest
    # to Odral Helvi, whose answers lead to 100 and 110. Elmussa's line to 41 and Crassius Curio's answer that
    # leads to 50 are not asked for by the journal.
    - stages: 40-41
      next: [100, 110]

  HH_DisguisedArmor:
