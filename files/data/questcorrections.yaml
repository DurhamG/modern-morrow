        - { task: talk, object: bevene releth, done: { quest: Town_Ald_Bevene, atLeast: 3 } }

  town_balmora:
    # Journals 1, 3, 5 and 10 point the player to Larrius Varro at Fort Moonmoth. His lines in "little story" and
    # "bloodbath" lead to 15 and 20. The default rule also marks the rumour lines that lead to 5 and 10, and the five
    # Camonna Tong members to kill, whom no journal names until 29.
    - stages: [1, 3, 5, 10]
      next: [15, 20]
    # Journal 15 is Varro's hint at a bloodbath. His line in "bloodbath" leads to 20.
    - stages: 15
      next: 20
    # Journal 20 says Varro wants the names of five Camonna Tong members in Balmora. Only Thieves Guild members know
    # them, through "Camonna Tong" (to 27) and "bad people" (to 29). The journal doesn't name the guild, so its
    # members are optional. The kills are hidden until the names are known.
    - stages: 20
      optional: [27, 29]
      hide: [30, 35]
    # Journal 27 names the Council Club as the Camonna Tong's hangout in Balmora. It is marked until a Thieves Guild
    # member names the five, which leads to 29. The kills are still hidden.
    - stages: 27
      optional: 29
      hide: [30, 35]
      targets:
        - { task: visit, cell: "Balmora, Council Club", done: { quest: town_balmora, atLeast: 29 } }

  town_Sadrith:
    # Journal 5 is Angaredhel's account. His line in "Gateway haunting" leads to 6. Arara Uvulas, whom he mentions,
    # answers the same topic and leads to 10, so she is a side step here.
    - stages: 5
      next: 6
      optional: 10
    # Journals 6 and 8 send the player to Arara Uvulas at the Telvanni Council House. Her line in "Gateway haunting"
    # leads to 10.
    - stages: [6, 8]
      next: 10
    # Journal 10 says a Conjuration expert may be behind the ghost. Anyone in Wolverine Hall answers "Conjuration
    # expert" and leads to 15. Uleni Heleran's lines that lead to 35 need town_sadrith_expert at 1 or more, which a
    # Sadrith Mora resident sets by naming her. So she is marked once someone has named her. The line about her
    # that leads to 20 names her before the journal does.
    - stages: 10
      next: [15, 35]
    # Journals 15 and 20 name Uleni Heleran at the Mages Guild. Her lines in "Gateway haunting" lead to 30 and 35.
    - stages: [15, 20]
      next: [30, 35]
    # Journal 30 says Uleni brushed the player off. Her lines that lead to 35 need persuading her.
    - stages: 30
      next: 35

  town_Tel_Vos:
    # Journal 10 sends the player to the Zainab camp to learn what goods the tribe wants. This quest stays at 10 until
    # Turedus Talanian takes the report. His lines that lead to 35 need town_Tel_Vos_wise or town_Tel_Vos_she at 1,
    # so he is marked once one of them is set. Before that, nothing is marked. Ashur-Dan, the camp's trader, answers
    # "trade goods wanted" in town_Tel_Vos_ashur, and his answer suggests asking the men and women of the tribe.
    # Sonummu Zabamat, the wise woman, answers the same topic in town_Tel_Vos_wise, so she is optional after him.
    - stages: 10
      targets:
        - { task: talk, object: ashur-dan, done: { quest: town_Tel_Vos_ashur, started: true } }
        - { task: talk, object: sonummu zabamat, optional: true, after: { quest: town_Tel_Vos_ashur, started: true },
            done: { quest: town_Tel_Vos_wise, started: true } }

  town_Tel_Vos_ashur:
    # Journal 1 says Ashur-Dan knew of no goods the tribe needs. His other answer in "trade goods wanted", which
    # leads to 5, only adds the advice to ask the tribe, so it is a side step.
    - stages: 1
      optional: 5

  town_Vivec:
    # Journal 1 is a rumour that the Office of the Watch wants help with the killings. Elam Andas runs it, and his
    # answer in "work" leads to 10. The default rule also marks the many people whose rumour leads to 5.
    - stages: 1
      next: 10
    # Journal 20 describes a Dunmer woman with a dagger. People in the Foreign Quarter and a few Vivec shops and
    # guilds answer "woman with a dagger", which leads to 25. They are places to ask around, so they are optional.
    # Elam's answers that lead to 50 and 55 pay the reward once the killer, dreamer prophet, is dead, so he is
    # marked only after that.
    - stages: 20
      optional: 25
      hide: [50, 55]
      targets:
        - { task: talk, object: elam andas, after: { dead: dreamer prophet }, done: { quest: town_Vivec, atLeast: 50 } }
    # Journal 25 says a Dunmer woman was seen in the Foreign Quarter Underworks. Elam's answer in "work" that led
    # to 10 enabled dreamer prophet, who is placed there. She is marked to kill, and then Elam for the reward.
    - stages: 25
      hide: [50, 55]
      targets:
        - { task: kill, object: dreamer prophet, done: { dead: dreamer prophet } }
        - { task: talk, object: elam andas, after: { dead: dreamer prophet }, done: { quest: town_Vivec, atLeast: 50 } }
