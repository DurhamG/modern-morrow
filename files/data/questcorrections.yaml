      next: 50
      hide: 11
    # Journal 50 says to bring the scroll to Nileno Dorvayn, whose answer leads to 100. The default rule also marks
    # Neminda through her answer that leads to 150, when the player talks to her without the helm.
    - stages: 50
      next: 100

  HH_EbonyDelivery:
    # Journal 10 says to deliver the ebony to Drinar Varyon in Ald'ruhn, whose answer leads to 50. Odral Helvi
    # gave the player the five pieces. The default rule marks Crassius Curio (20) and Segunivus Mantedius (60)
