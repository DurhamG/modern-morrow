    verdict: corrected  # The Spirit Bear is marked, without Rolf, who now follows the player.
    marked: ["bm_bear_spr_unique", "bm_bearheart_unique"]
  - stage: 75
    verdict: corrected  # The heart on the bear's body and then Korst are marked, without Rolf beside the player.
    marked: ["bm_bearheart_unique", "korst wind-eye"]
  - stage: 80
    verdict: corrected  # Korst is marked to receive the heart, without Rolf beside the player.
    marked: ["bm_bearheart_unique", "korst wind-eye"]
