    marked: ["sattir the bold"]
  - stage: 40
    verdict: right  # Rolf is marked to hear about Sattir's death.
    marked: ["korst wind-eye", "rolf long-tooth"]
  - stage: 45
    verdict: corrected  # Rolf is marked while the player follows him, without Grerid, who hasn't been attacked yet.
    marked: ["korst wind-eye", "rolf long-tooth"]
  - stage: 50
    verdict: corrected  # Grerid, whom Rolf sent the player to find, is marked, not Rolf.
    marked: ["grerid axe-wife"]
