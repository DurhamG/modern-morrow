# The reviewed quest markers of CO_5.
# Each stage lists the targets the markers should show, worked out from the content files and
# questcorrections.yaml, and the reviewer's verdict.
quest: CO_5
stages:
  - stage: 10
    verdict: corrected  # Falco is marked alone, without Baro's line that needs the saber.
    marked: ["falco galenus"]
  - stage: 20
    verdict: corrected  # Baro at the dock is marked, without Falco's line about Elberoth, who hasn't been named yet.
    marked: ["baro egnatius"]
  - stage: 30
    verdict: corrected  # Falco is marked, to suggest asking Apronia or, if she never reached the colony, to talk about Elberoth.
    marked: ["falco galenus"]
  - stage: 40
    verdict: corrected  # Apronia is marked for the saber, without Falco's line that assumes the player has it.
    marked: ["apronia alfena"]
  - stage: 50
    verdict: corrected  # Falco is marked for his idea, without Baro's line that needs the saber drawn.
    marked: ["falco galenus"]
  - stage: 55
    verdict: corrected  # Baro is marked to talk to with the saber drawn, not to kill.
    marked: ["baro egnatius"]
  - stage: 60
    verdict: right  # Falco or Carnius is marked to hear the news, by the player's side.
    marked: ["falco galenus"]
  - stage: 65
    verdict: right  # Carnius is marked, as the journal asks.
    marked: ["carnius magius"]
  - stage: 200
    verdict: right  # Falco, and Carnius on his side, are marked to hear of Baro's death.
    marked: ["carnius magius", "falco galenus"]
