# The reviewed quest markers of HT_Odirniran.
# Each stage lists the targets the markers should show, worked out from the content files and
# questcorrections.yaml, and the reviewer's verdict.
quest: HT_Odirniran
stages:
  - stage: 10
    verdict: corrected  # Only Milyn Faram is marked, as the journal says to find him first
    marked: ["milyn faram"]
  - stage: 30
    verdict: corrected  # Remasa Othril is marked to kill, then Milyn, without the shortcut report to Aryon
    marked: ["milyn faram", "remasa othril"]
  - stage: 50
    verdict: corrected  # Aryon is marked to report to, and Milyn's research talk is optional
    marked: ["aryon", "remasa othril"]
    optional: ["milyn faram"]
  - stage: 60
    verdict: right  # Aryon is the one to report to
    marked: ["aryon", "remasa othril"]
