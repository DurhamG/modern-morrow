    marked: ["bk_widowdeed", "general darius", "widow vabdas"]
  - stage: 30
    verdict: right  # The widow is marked to ask about her husband, with the deed as the other way.
    marked: ["bk_widowdeed", "general darius", "widow vabdas"]
