# The reviewed quest markers of MS_Hannat.
# Each stage lists the targets the markers should show, worked out from the content files and
# questcorrections.yaml, and the reviewer's verdict.
quest: MS_Hannat
stages:
  - stage: 1
    verdict: unfixable  # the goal is the way out of Mamaea, which no target can name; only Hannat, who follows the player, is marked
    marked: ["hannat zainsubani"]
  - stage: 50
    verdict: right  # Hannat's thanks and his father Hassour, named in journal 1, are marked
    marked: ["hannat zainsubani", "hassour zainsubani"]
  - stage: 60
    verdict: right  # Hassour Zainsubani is marked as the journal says
    marked: ["hassour zainsubani"]
