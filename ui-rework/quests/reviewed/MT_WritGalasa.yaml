# The reviewed quest markers of MT_WritGalasa.
# Each stage lists the targets the markers should show, worked out from the content files and
# questcorrections.yaml, and the reviewer's verdict.
quest: MT_WritGalasa
stages:
  - stage: 10
    verdict: right  # the writ's target, Galasa Uvayn in the Hlaalu Treasury, is marked to kill
    marked: ["galasa uvayn"]
  - stage: 80
    verdict: right  # the target is dead, so the kill marks nothing and the nearest Morag Tong master is marked to report to
    marked: ["faction:morag tong", "galasa uvayn"]
  - stage: 90
    verdict: right  # the nearest Morag Tong master is marked to report to
    marked: ["faction:morag tong", "galasa uvayn"]
