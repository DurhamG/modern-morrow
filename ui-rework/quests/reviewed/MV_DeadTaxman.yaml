    verdict: corrected  # Nothing is marked until the player carries 200 gold again, and then Socucius, never the unnamed murderer or his ring.
    marked: ["chargen class"]
  - stage: 46
    verdict: right  # The same line sets 48 at once, so this stage never lasts.
    marked: ["exquisite_ring_processus", "foryn gilnith", "thavere vedrano"]
