    verdict: corrected  # Thavere in the lighthouse is marked, as the townsfolk suggested, without the murderer.
    marked: ["thavere vedrano"]
  - stage: 60
    verdict: right  # Foryn, whom Thavere named and who carries the ring she asked about, is marked.
    marked: ["exquisite_ring_processus", "foryn gilnith", "thavere vedrano"]
