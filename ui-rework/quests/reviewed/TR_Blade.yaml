# The reviewed quest markers of TR_Blade.
# Each stage lists the targets the markers should show, worked out from the content files and
# questcorrections.yaml, and the reviewer's verdict.
quest: TR_Blade
stages:
  - stage: 10
    verdict: right  # Almalexia is marked
    marked: ["almalexia", "nerevarblade_01_flame"]
  - stage: 15
    verdict: right  # Almalexia is marked
    marked: ["almalexia", "nerevarblade_01_flame"]
