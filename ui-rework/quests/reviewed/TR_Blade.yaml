  - stage: 55
    verdict: corrected  # the pieces and Yagak gro-Gluk are marked, and King Helseth until the duel for Karrod's piece starts
    marked: ["almalexia", "bladepiece_01", "bladepiece_02", "bladepiece_03", "king hlaalu helseth", "nerevarblade_01_flame", "yagak gro-gluk"]
  - stage: 60
